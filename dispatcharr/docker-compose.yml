services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    ports:
      - 9191:9191
    restart: unless-stopped
    volumes:
      - E:\Docker\dispatcharr\data:/data
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    # Optional for hardware acceleration
    deploy:
     resources:
         reservations:
             devices:
                 - driver: nvidia
                   count: all
                   capabilities: [gpu]
    networks:
        - proxynet

networks:
  proxynet:
    external:
        name: proxynet


volumes:
  dispatcharr_data: