services:
  seerr:
    image: ghcr.io/rubiss/seerr:book-support@sha256:441147eb047010e9a73c8a06baf19f4ba73162a4af09b2264fa688159cd1ff9e
    container_name: seerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_LEVEL=debug
      - SEERR_BOOKS_DISCORD_WEBHOOK_URL=${SEERR_BOOKS_DISCORD_WEBHOOK_URL:-}
      - SEERR_MOVIES_TV_DISCORD_WEBHOOK_URL=${SEERR_MOVIES_TV_DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./config:/app/config
    ports:
      - 5056:5055
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - proxynet
    labels:
      - homepage.group=Media Management
      - homepage.name=Seerr
      - homepage.icon=jellyseerr.png
      - homepage.href=https://request.benlawson.dev/
      - homepage.siteMonitor=http://seerr:5055
      - homepage.description=Media requests
      - homepage.widget.type=jellyseerr
      - homepage.widget.url=http://seerr:5055
      - homepage.widget.key=${SEERR_API_KEY}
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Media Management
      - swag.uptime-kuma.monitor.url=https://request.benlawson.dev

networks:
  proxynet:
    external: true
    name: proxynet
