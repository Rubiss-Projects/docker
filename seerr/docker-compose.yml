services:
  seerr:
    image: ghcr.io/jabloink/jellyseerr:preview-books
    container_name: seerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_LEVEL=debug
    volumes:
      - ./config:/app/config
    ports:
      - 5056:5055
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxynet
    labels:
      - homepage.group=Media Management
      - homepage.name=Seerr
      - homepage.icon=jellyseerr.png
      - homepage.href=https://request.benlawson.dev/
      - homepage.siteMonitor=http://seerr:5055
      - homepage.description=Media requests
      - homepage.widget.type=jellyseerr
      - homepage.widget.url=http://seerr:5055
      - homepage.widget.key=${SEERR_API_KEY}

networks:
  proxynet:
    external: true
    name: proxynet
