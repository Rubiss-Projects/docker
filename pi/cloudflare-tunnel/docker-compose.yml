services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:2026.7.2
    container_name: cloudflared-pi
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Cloudflare Tunnel (Pi)
      - homepage.icon=cloudflare-zero-trust.png
      - homepage.description=Secure tunnel to Cloudflare
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=${CLOUDFLARE_ACCOUNT_ID}
      - homepage.widget.tunnelid=${CLOUDFLARE_TUNNEL_ID}
      - homepage.widget.key=${CLOUDFLARE_API_KEY}
