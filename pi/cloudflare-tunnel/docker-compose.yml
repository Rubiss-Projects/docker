services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    container_name: cloudflared-pi
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Cloudflare Tunnel (Pi)
      - homepage.icon=cloudflare-zero-trust.png
      - homepage.description=Secure tunnel to Cloudflare
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=${CLOUDFLARE_ACCOUNT_ID}
      - homepage.widget.tunnelid=${CLOUDFLARE_TUNNEL_ID}
      - homepage.widget.key=${CLOUDFLARE_API_KEY}
