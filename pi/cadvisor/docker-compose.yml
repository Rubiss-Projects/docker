services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    labels:
      - homepage.group=Observability
      - homepage.name=cAdvisor (Pi)
      - homepage.icon=cadvisor.png
      - homepage.href=http://192.168.50.216:8080
      - homepage.description=Pi container monitoring
      - homepage.siteMonitor=http://192.168.50.216:8080
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
