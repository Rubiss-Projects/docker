services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
    restart: unless-stopped
    # Pi-hole FTL stores query history in /dev/shm; the default 64M is exhausted here.
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"  # DHCP (optional, only if you want Pi-hole to handle DHCP)
      - "80:80/tcp"  # Web interface
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${WEBPASSWORD}
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - PIHOLE_DNS_=8.8.8.8;8.8.4.4  # Upstream DNS servers
      - FTLCONF_dns_listeningMode=all  # Allow DNS queries from all interfaces (Pi-hole v6 syntax)
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Pi-hole
      - homepage.icon=pi-hole.png
      - homepage.href=https://dns.benlawson.dev/admin
      - homepage.description=Network-wide DNS ad blocking
      - homepage.siteMonitor=https://dns.benlawson.dev/admin/login
      - homepage.widget.type=pihole
      - homepage.widget.url=https://dns.benlawson.dev
      - homepage.widget.key=${HOMEPAGE_API_KEY}
      - homepage.widget.version=6
    dns:
      - 127.0.0.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
