services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"  # DHCP (optional, only if you want Pi-hole to handle DHCP)
      - "80:80/tcp"  # Web interface
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${WEBPASSWORD}
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - PIHOLE_DNS_=8.8.8.8;8.8.4.4  # Upstream DNS servers
      - DNSMASQ_LISTENING=all  # Allow DNS queries from all interfaces
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
