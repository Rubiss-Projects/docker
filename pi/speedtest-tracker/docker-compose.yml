services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:0.21.2
    restart: unless-stopped
    container_name: speedtest-tracker-pi
    ports:
      - "8082:80"
      - "8444:443"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SPEEDTEST_SCHEDULE=${SPEEDTEST_SCHEDULE}
      - APP_TIMEZONE=${APP_TIMEZONE}
      - DISPLAY_TIMEZONE=${DISPLAY_TIMEZONE}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=sqlite
    volumes:
      - ./data:/config
    labels:
      - homepage.group=Observability
      - homepage.name=Speedtest (Pi)
      - homepage.icon=speedtest-tracker.png
      - homepage.href=https://speed-pi.benlawson.dev
      - homepage.description=Pi internet speed tests
      - homepage.siteMonitor=http://192.168.50.216:8082
      - homepage.widget.type=speedtest
      - homepage.widget.url=http://192.168.50.216:8082
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
