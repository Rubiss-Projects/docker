services:
  n8n:
    image: n8nio/n8n:2.47.3@sha256:6723b440354bb8e1395a1ecee12685fe03923f897bf6e4d5bb2c6c2bd2051697
    container_name: n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "5678:5678"
    user: root
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_USER_FOLDER=/root/.n8n
    volumes:
      - ./config:/root/.n8n
      - ./workflows:/files:ro
    labels:
      - homepage.group=AI & Automation
      - homepage.name=n8n
      - homepage.icon=n8n.png
      - homepage.href=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - homepage.description=Workflow automation
      - homepage.showStats=true
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=AI & Automation
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet
