services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.25.7
    container_name: n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "5678:5678"
    user: root
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_USER_FOLDER=/root/.n8n
      - DOCKER_HOST=tcp://socket-proxy:2375
      - NODES_EXCLUDE=[]
    volumes:
      - ./config:/root/.n8n
      - ./workflows:/files
      - ../:/mnt/e/Docker
    entrypoint: /bin/sh
    command: -c "sh /files/import-workflows.sh"
    labels:
      - homepage.group=AI & Automation
      - homepage.name=n8n
      - homepage.icon=n8n.png
      - homepage.href=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - homepage.description=Workflow automation
      - homepage.widget.type=n8n
      - homepage.widget.url=http://n8n:5678
      - homepage.widget.key=${HOMEPAGE_WIDGET_KEY}
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=AI & Automation
    networks:
      - proxynet
      - socket-proxy-net

networks:
  proxynet:
    name: proxynet
  socket-proxy-net:
    external: true
    name: socket-proxy-net
