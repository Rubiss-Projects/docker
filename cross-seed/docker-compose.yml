services:
  # Disables fs.protected_hardlinks in the Docker VM kernel so cross-seed (uid 1000)
  # can create hardlinks to media files owned by other UIDs (e.g. 911 from legacy Sonarr/Radarr).
  # This sysctl is not namespace-aware, so it must be set via a privileged init container.
  sysctl-init:
    image: alpine
    container_name: cross-seed-sysctl
    privileged: true
    command: sh -c 'echo 0 > /proc/sys/fs/protected_hardlinks'
    restart: "no"

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    user: 1000:1000
    ports:
      - "2468:2468"
    volumes:
      - ./config:/config
      - ../../Media:/data
    command: daemon
    restart: unless-stopped
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
    labels:
      - homepage.group=Downloads
      - homepage.name=Cross-Seed
      - homepage.icon=cross-seed.png
      - homepage.href=http://cross-seed:2468
      - homepage.siteMonitor=http://cross-seed:2468/api/ping
      - homepage.description=Automated cross-seeding
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Downloads
      - swag.uptime-kuma.monitor.url=http://cross-seed:2468/api/ping
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet