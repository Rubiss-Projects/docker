---
version: "2.1"
services:
    plex:
        image: ghcr.io/linuxserver/plex
        container_name: plex
        ports:
            - 32400:32400
            - 1900:1900/udp
            - 3005:3005
            # - 5353:5353/udp
            - 8324:8324
            - 32410:32410/udp
            - 32412:32412/udp
            - 32413:32413/udp
            - 32414:32414/udp
            - 32469:32469
        environment:
            - PUID=1000
            - PGID=1000
            - VERSION=docker
        volumes:
            - D:/Docker/plex/config:/config
            - D:/Docker/plex/library/tv:/tv
            - D:/Docker/plex/library/movies:/movies
        restart: unless-stopped