services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ./config:/config
    environment:
      - TZ=America/Chicago
      - CRON_SCHEDULE=@daily
    restart: unless-stopped
    networks:
      - proxynet
    labels:
      - homepage.group=Media Management
      - homepage.name=Recyclarr
      - homepage.icon=recyclarr.png
      - homepage.description=TRaSH Guide sync
      - swag.uptime-kuma.enabled=false

networks:
  proxynet:
    external: true
    name: proxynet
