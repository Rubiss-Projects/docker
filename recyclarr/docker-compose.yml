services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ./config:/config
    environment:
      - TZ=America/Chicago
      - CRON_SCHEDULE=@daily
    restart: unless-stopped
    networks:
      - proxynet
    labels:
      - homepage.group=Media Management
      - homepage.name=Recyclarr
      - homepage.icon=recyclarr.png
      - homepage.description=TRaSH Guide sync
      - swag.uptime-kuma.enabled=false

networks:
  proxynet:
    external: true
    name: proxynet
