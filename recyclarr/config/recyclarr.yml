# yaml-language-server: $schema=https://schemas.recyclarr.dev/latest/config-schema.json

# TRaSH Guides sync configuration
# Runs daily on the server schedule to keep Radarr/Sonarr in sync with TRaSH recommendations
# Docs: https://recyclarr.dev/reference/configuration/

radarr:
  movies:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey
    delete_old_custom_formats: true

    quality_definition:
      type: movie

    media_naming:
      folder: default
      movie:
        rename: true
        standard: standard

    quality_profiles:
      # HD Bluray + WEB — 6-15 GB per movie
      - trash_id: d1d67249d3890e49bc12e275d989a7e9
        language: English
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      - trash_id: 9ca12ea80aa55ef916e3751f4b874151 # Remux + WEB 1080p
        language: English
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        language: English
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      - trash_id: fd161a61e3ab826d3a22d53f935696dd # Remux + WEB 2160p
        language: English
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      - trash_id: 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      - trash_ids:
          - 127bdbadcf3e4463a8c707759fbaad75 # WiTH AD
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
          - trash_id: 9ca12ea80aa55ef916e3751f4b874151
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f
          - trash_id: fd161a61e3ab826d3a22d53f935696dd
      - trash_ids:
          - 0dc8aec3bd1c47cd6c40c46ecd27e846 # Language: Not English
        assign_scores_to:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9
            score: -10000
          - trash_id: 9ca12ea80aa55ef916e3751f4b874151
            score: -10000
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f
            score: -10000
          - trash_id: fd161a61e3ab826d3a22d53f935696dd
            score: -10000

sonarr:
  tv:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey
    delete_old_custom_formats: true

    quality_definition:
      type: series

    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_profiles:
      # WEB-1080p — preferred for most TV content
      - trash_id: 72dae194fc92bf828f32cde7744e51a1
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      # Keep the guide's HD fallback sources for older/less available TV.
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9 # WEB-1080p (Alternative)
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      - trash_id: dfa5eaae7894077ad6449169b6eb03e0 # WEB-2160p (Alternative)
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        upgrade:
          allowed: false
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # Non-anime requires English, including shows originally made abroad.
      - trash_ids:
          - 69aa1e159f97d860440b04cd6d590c4f # Language: Not English
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: -10000
          - trash_id: 9d142234e45d6143785ac55f5a9e8dc9
            score: -10000
          - trash_id: dfa5eaae7894077ad6449169b6eb03e0
            score: -10000
      # Allow English dubs without also requiring the original-language track.
      - trash_ids:
          - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1
            score: 0
          - trash_id: 9d142234e45d6143785ac55f5a9e8dc9
            score: 0
          - trash_id: dfa5eaae7894077ad6449169b6eb03e0
            score: 0
