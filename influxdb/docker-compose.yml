services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    volumes:
      - ./data:/var/lib/influxdb2:rw
    ports:
      - "8086:8086"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=Observability
      - homepage.name=Influxdb
      - homepage.icon=influxdb.png
      - homepage.href=https://influx.benlawson.dev/
      - homepage.siteMonitor=http://influxdb:8086/health
      - homepage.description=Metrics database
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet
