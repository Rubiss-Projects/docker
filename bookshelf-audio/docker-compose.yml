services:
  # Bookshelf is an ebook and audiobook collection manager (Readarr fork)
  # https://github.com/pennydreadful/bookshelf
  bookshelf-audio:
    image: ghcr.io/pennydreadful/bookshelf:hardcover@sha256:388eecc94362580eae31ee0a454be6af516f8a311f8432a521c202fb475f4359
    container_name: bookshelf-audio
    volumes:
      - ../../Media:/data
      - ./config:/config
    ports:
      - 8788:8787
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    restart: unless-stopped
    labels:
      - homepage.group=Media Management
      - homepage.name=Bookshelf-Audio
      - homepage.icon=readarr.png
      - homepage.href=https://bookshelf-audio.benlawson.dev/
      - homepage.siteMonitor=http://bookshelf-audio:8787/ping
      - homepage.description=Audiobook management
      - homepage.widget.type=readarr
      - homepage.widget.url=http://bookshelf-audio:8787
      - homepage.widget.key=${BOOKSHELF_API_KEY}
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Media Management
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet
