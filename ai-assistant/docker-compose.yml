services:
  ai-assistant:
    image: ghcr.io/rubiss-projects/ai-assistant:v1.5.1
    container_name: ai-assistant
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    environment:
      HOME: /data
      AI_ASSISTANT_CONFIG_DIR: /data
      AI_ASSISTANT_WORKSPACE_ROOT: /data/workspaces
    volumes:
      - ai-assistant-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile blocks the user namespaces required by
      # the Codex shared-mode Bubblewrap sandbox. This profile retains Docker's
      # defaults while narrowly enabling its namespace and mount syscalls.
      - seccomp=./seccomp-bwrap.json
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const self=String(process.pid);const ok=fs.readdirSync('/proc').filter(p=>p!==self&&/^\\d+$/.test(p)).some(p=>{try{return fs.readFileSync('/proc/'+p+'/cmdline','utf8').includes('dist/src/index.js')}catch{return false}});process.exit(ok?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - homepage.group=AI & Automation
      - homepage.name=AI Assistant
      - homepage.icon=discord.png
      - homepage.description=Discord assistant powered by Codex
      - homepage.showStats=true
      # This service has no HTTP endpoint; it uses a native Uptime Kuma Docker monitor.
      - swag.uptime-kuma.enabled=false
    networks:
      - proxynet

volumes:
  ai-assistant-data:
    name: ai-assistant-data

networks:
  proxynet:
    external: true
    name: proxynet
