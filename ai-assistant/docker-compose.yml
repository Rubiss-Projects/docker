services:
  ai-assistant:
    image: ghcr.io/rubiss-projects/ai-assistant:v1.12.1
    container_name: ai-assistant
    restart: unless-stopped
    # Let scheduled inference finish within its default 10-minute timeout, plus cleanup.
    stop_grace_period: 11m
    init: true
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    environment:
      HOME: /data
      AI_ASSISTANT_CONFIG_DIR: /data
      AI_ASSISTANT_WORKSPACE_ROOT: /data/workspaces
      AI_ASSISTANT_BROWSER_URL: http://browser:3123
    depends_on:
      browser:
        condition: service_healthy
    volumes:
      - ai-assistant-data:/data
      - ./rights.json:/etc/ai-assistant/rights.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile blocks the user namespaces required by
      # the Codex shared-mode Bubblewrap sandbox. This profile retains Docker's
      # defaults while enabling namespace/mount syscalls and Chromium sandbox chroot.
      - seccomp=./seccomp-bwrap.json
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const self=String(process.pid);const ok=fs.readdirSync('/proc').filter(p=>p!==self&&/^\\d+$/.test(p)).some(p=>{try{return fs.readFileSync('/proc/'+p+'/cmdline','utf8').includes('dist/src/index.js')}catch{return false}});process.exit(ok?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - homepage.group=AI & Automation
      - homepage.name=AI Assistant
      - homepage.icon=discord.png
      - homepage.description=Discord assistant powered by Codex
      - homepage.showStats=true
      # This service has no HTTP endpoint; it uses a native Uptime Kuma Docker monitor.
      - swag.uptime-kuma.enabled=false
    networks:
      - proxynet
      - browser-control

  browser:
    image: ghcr.io/rubiss-projects/ai-assistant:v1.12.1
    container_name: ai-assistant-browser
    entrypoint: ["node", "/app/dist/src/browserWorker.js"]
    restart: unless-stopped
    init: true
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-bwrap.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3123/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - browser-control
      - browser-egress

volumes:
  ai-assistant-data:
    name: ai-assistant-data

networks:
  browser-control:
    internal: true
  browser-egress:
  proxynet:
    external: true
    name: proxynet
