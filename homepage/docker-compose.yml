services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.0.0
    container_name: homepage
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=homepage.benlawson.dev,localhost:3030,127.0.0.1:3030
      - DOCKER_HOST=tcp://socket-proxy:2375
    ports:
      - 3030:3000
    volumes:
      - ./config:/app/config
      - ./config/icons:/app/public/icons
      - /mnt/c:/c:ro
      - /mnt/e:/e:ro
    restart: unless-stopped
    labels:
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Infrastructure
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - proxynet
      - socket-proxy-net

networks:
  proxynet:
    name: proxynet
  socket-proxy-net:
    external: true
    name: socket-proxy-net