# https://gethomepage.dev/en/configs/services

- Hardware:
    - QNAP NAS:
        icon: qnap.png
        href: https://nas.benlawson.dev/
        description: Network-attached storage
        siteMonitor: http://192.168.50.91:8080/
        # Storage allocation and quotas remain separate verified Grafana panels.
        widget:
          type: qnap
          url: https://nas.benlawson.dev:4443
          username: "{{HOMEPAGE_VAR_QNAP_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QNAP_PASSWORD}}"
          fields: ["cpuUsage", "memUsage", "systemTempC"]
    - APC UPS:
        icon: mdi-power-plug-battery
        href: https://grafana.benlawson.dev/d/apc-ups
        description: Uninterruptible power supply
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: Charge
              query: nut:battery_charge_percent
              format:
                type: number
                suffix: "%"
            - label: Runtime estimate
              query: nut:battery_runtime_seconds / 60
              format:
                type: number
                suffix: " min"
                options:
                  maximumFractionDigits: 1
            - label: Load
              query: nut:load_percent
              format:
                type: number
                suffix: "%"
    - NVIDIA GPU:
        icon: nvidia.svg
        description: GPU stats
        server: my-docker
        container: nvidia-smi-rest
        widget:
          type: customapi
          url: http://nvidia-smi-rest:7777
          refreshInterval: 5000
          mappings:
            - field:
                nvidia_smi_log:
                  gpu:
                    utilization: gpu_util
              label: GPU
              format: percent
            - field:
                nvidia_smi_log:
                  gpu:
                    fb_memory_usage: used
              label: VRAM
            - field:
                nvidia_smi_log:
                  gpu:
                    temperature: gpu_temp
              label: Temp
              suffix: "°C"
            - field:
                nvidia_smi_log:
                  gpu:
                    gpu_power_readings: power_draw
              label: Power
    - HDHomeRun:
        icon: hdhomerun.png
        href: http://192.168.50.130
        siteMonitor: http://192.168.50.130
        description: Over The Air TV
        widget:
          type: hdhomerun
          url: http://192.168.50.130
          tuner: 0
          fields: ["clientIP", "channels", "hd", "tunerCount"]
    - HDHomeRun Tuner 0:
        icon: hdhomerun.png
        href: http://192.168.50.130
        siteMonitor: http://192.168.50.130
        description: Over The Air TV
        widget:
          type: hdhomerun
          url: http://192.168.50.130
          tuner: 0
          fields: ["channelNumber", "channelNetwork", "signalStrength", "signalQuality"]
    - HDHomeRun Tuner 1:
        icon: hdhomerun.png
        href: http://192.168.50.130
        siteMonitor: http://192.168.50.130
        description: Over The Air TV
        widget:
          type: hdhomerun
          url: http://192.168.50.130
          tuner: 1
          fields: ["channelNumber", "channelNetwork", "signalStrength", "signalQuality"]
