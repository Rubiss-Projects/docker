# https://gethomepage.dev/en/configs/services

- Infrastructure:
    - Caddy:
        icon: caddy.svg
        href: https://grafana.benlawson.dev/d/caddy-overview
        description: Plex remote / Channels LAN · Ubuntu
        siteMonitor: http://192.168.50.40:19019/healthz
        widget:
          type: caddy
          url: http://192.168.50.40:19019
          fields: ["upstreams", "requests", "requests_failed"]

- Media Consumption:
    - Channels LAN:
        icon: channels-dvr.png
        href: http://192.168.50.40:18089
        description: At Home · IPTV and HDHomeRun
        siteMonitor: http://192.168.50.40:18089/healthz

- Hardware:
    - QNAP NAS:
        icon: qnap.png
        href: https://nas.benlawson.dev/
        description: TS-664 · RAID5 · storage details in Grafana
        siteMonitor: http://192.168.50.91:8080/
        # Enable the authenticated widget after initialization and storage validation.
        # See docs/qnap-monitoring.md for the account, secrets and acceptance checks.
    - APC UPS:
        icon: mdi-power-plug-battery
        href: https://grafana.benlawson.dev/d/apc-ups
        description: BR1500MS2 · monitoring only
        widget:
          type: apcups
          url: tcp://host.docker.internal:3551
    - NAS UPS telemetry:
        icon: mdi-power-plug-battery
        href: https://grafana.benlawson.dev/d/nut-ups
        description: NUT handoff pending · APC above remains current
        widget:
          type: prometheusmetric
          url: http://prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: Data available (1=yes)
              query: nut:telemetry_available
              format:
                type: number
            - label: Charge
              query: nut:battery_charge_percent
              format:
                type: number
                suffix: "%"
            - label: Runtime estimate
              query: nut:battery_runtime_seconds / 60
              format:
                type: number
                suffix: " min"
                options:
                  maximumFractionDigits: 1
            - label: Load
              query: nut:load_percent
              format:
                type: number
                suffix: "%"
    - NVIDIA GPU:
        icon: nvidia.svg
        description: GPU stats
        server: my-docker
        container: nvidia-smi-rest
        widget:
          type: customapi
          url: http://nvidia-smi-rest:7777
          refreshInterval: 5000
          mappings:
            - field:
                nvidia_smi_log:
                  gpu:
                    utilization: gpu_util
              label: GPU
              format: percent
            - field:
                nvidia_smi_log:
                  gpu:
                    fb_memory_usage: used
              label: VRAM
            - field:
                nvidia_smi_log:
                  gpu:
                    temperature: gpu_temp
              label: Temp
              suffix: "°C"
            - field:
                nvidia_smi_log:
                  gpu:
                    gpu_power_readings: power_draw
              label: Power
    - HDHomeRun:
        icon: hdhomerun.png
        href: http://192.168.50.130
        siteMonitor: http://192.168.50.130
        description: Over The Air TV
        widget:
          type: hdhomerun
          url: http://192.168.50.130
          tuner: 0
          fields: ["clientIP", "channels", "hd", "tunerCount"]
    - HDHomeRun Tuner 0:
        icon: hdhomerun.png
        href: http://192.168.50.130
        siteMonitor: http://192.168.50.130
        description: Over The Air TV
        widget:
          type: hdhomerun
          url: http://192.168.50.130
          tuner: 0
          fields: ["channelNumber", "channelNetwork", "signalStrength", "signalQuality"]
    - HDHomeRun Tuner 1:
        icon: hdhomerun.png
        href: http://192.168.50.130
        siteMonitor: http://192.168.50.130
        description: Over The Air TV
        widget:
          type: hdhomerun
          url: http://192.168.50.130
          tuner: 1
          fields: ["channelNumber", "channelNetwork", "signalStrength", "signalQuality"]
