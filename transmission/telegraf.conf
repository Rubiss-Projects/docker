# Appended to the existing Windows Telegraf config by install-telegraf.ps1.
# No new agent, output, credential, HTTP port or monitoring database.
[[inputs.exec]]
  commands = ['"C:\Program Files\Docker\Docker\resources\bin\docker.exe" --host npipe:////./pipe/dockerDesktopLinuxEngine exec transmission python3 /usr/local/bin/transmission-rpc-health --metrics']
  interval = "30s"
  timeout = "15s"
  data_format = "influx"

[[inputs.win_perf_counters]]
  interval = "10s"
  [[inputs.win_perf_counters.object]]
    ObjectName = "LogicalDisk"
    Instances = ["*"]
    Counters = ["Avg. Disk sec/Read", "Avg. Disk sec/Write", "Disk Reads/sec", "Disk Writes/sec", "Disk Read Bytes/sec", "Disk Write Bytes/sec"]
    Measurement = "win_disk"
  [[inputs.win_perf_counters.object]]
    ObjectName = "PhysicalDisk"
    Instances = ["*"]
    Counters = ["Avg. Disk sec/Read", "Avg. Disk sec/Write"]
    Measurement = "win_diskio"
