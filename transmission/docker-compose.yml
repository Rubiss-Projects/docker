services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.0.5
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TRANSMISSION_WEB_HOME= #optional
      - USER= #optional
      - PASS= #optional
      - WHITELIST= #optional
      - PEERPORT= #optional
      - HOST_WHITELIST= #optional
      - DOCKER_MODS=linuxserver/mods:transmission-env-var-settings
      - TRANSMISSION_DOWNLOAD_DIR=/downloads
      - TRANSMISSION_DHT_ENABLED=false
      - TRANSMISSION_IDLE_SEEDING_LIMIT_ENABLED=false
      - TRANSMISSION_RATIO_LIMIT_ENABLED=false
      - TRANSMISSION_DOWNLOAD_QUEUE_SIZE=3
      - TRANSMISSION_SEED_QUEUE_ENABLED=true
      - TRANSMISSION_SEED_QUEUE_SIZE=50
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED=false
      - TRANSMISSION_CACHE_SIZE_MB=48
      - TRANSMISSION_PEER_LIMIT_GLOBAL=100
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=25
      - TRANSMISSION_SCRIPT_TORRENT_DONE_ENABLED=true
      - TRANSMISSION_SCRIPT_TORRENT_DONE_FILENAME=/scripts/post-download.sh
    volumes:
      - ./data:/config
      - ../../Media/downloads:/downloads
      - ./watch:/watch
      - ../../Media/:/library
      - ./scripts:/scripts
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/transmission/web/"] 
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Downloads
      - homepage.name=Transmission
      - homepage.icon=transmission.png
      - homepage.href=https://transmission.benlawson.dev/
      - homepage.siteMonitor=http://transmission:9091/transmission/web
      - homepage.description=Torrent client
      - homepage.widget.type=transmission
      - homepage.widget.url=http://transmission:9091
      - homepage.widget.username=
      - homepage.widget.password=
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet