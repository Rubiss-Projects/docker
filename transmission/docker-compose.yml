services:
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.2
    container_name: transmission
    env_file:
      - .env
    environment:
      - DOCKER_MODS=linuxserver/mods:transmission-env-var-settings
      - TRANSMISSION_DOWNLOAD_DIR=/data/downloads
      - TRANSMISSION_INCOMPLETE_DIR=/data/downloads/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true
      - TRANSMISSION_DHT_ENABLED=false
      - TRANSMISSION_IDLE_SEEDING_LIMIT_ENABLED=false
      - TRANSMISSION_RATIO_LIMIT_ENABLED=false
      - TRANSMISSION_DOWNLOAD_QUEUE_SIZE=3
      - TRANSMISSION_SEED_QUEUE_ENABLED=false
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED=false
      - TRANSMISSION_CACHE_SIZE_MB=48
      - TRANSMISSION_PEER_LIMIT_GLOBAL=100
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=25
    volumes:
      - ./data:/config
      - ../../Media:/data
      - ./watch:/watch
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9091/transmission/rpc)\" = \"409\" ]"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - homepage.group=Downloads
      - homepage.name=Transmission
      - homepage.icon=transmission.png
      - homepage.href=https://transmission.benlawson.dev/
      - homepage.description=Torrent client
      - homepage.widget.type=transmission
      - homepage.widget.url=http://transmission:9091
      - homepage.widget.username=
      - homepage.widget.password=
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Downloads
      - swag.uptime-kuma.monitor.url=http://transmission:9091/transmission/rpc
      - swag.uptime-kuma.monitor.accepted_statuscodes=409
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet
