# The existing native Telegraf output, token and host inputs remain in telegraf.conf.
[global_tags]
  platform = "native_linux"

[[inputs.exec]]
  commands = ["/usr/bin/python3 /usr/local/lib/transmission/native-host-rpc.py"]
  interval = "5s"
  timeout = "4s"
  data_format = "influx"

[[inputs.exec]]
  commands = ["/usr/bin/python3 /usr/local/lib/transmission/native-host-rpc.py --aggregate"]
  interval = "30s"
  timeout = "15s"
  data_format = "influx"

# An expected 409 proves reachability only. The functional probes validate RPC.
[[inputs.http_response]]
  urls = ["http://127.0.0.1:9091/transmission/rpc"]
  interval = "30s"
  response_timeout = "5s"
  response_status_code = 409
  name_override = "transmission_endpoint"
