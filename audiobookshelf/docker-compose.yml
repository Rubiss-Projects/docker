services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - 13378:80
    volumes:
      - ../../Media/audiobooks:/audiobooks
      - ./config:/config
      - ./metadata:/metadata
    environment:
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=Media Consumption
      - homepage.name=Audiobookshelf
      - homepage.icon=audiobookshelf.png
      - homepage.href=https://audiobookshelf.benlawson.dev/
      - homepage.siteMonitor=http://audiobookshelf:80
      - homepage.description=Audiobook & podcast server
      - homepage.widget.type=audiobookshelf
      - homepage.widget.url=http://audiobookshelf:80
      - homepage.widget.key=${AUDIOBOOKSHELF_API_KEY}
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet
