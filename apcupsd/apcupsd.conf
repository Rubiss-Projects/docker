## apcupsd.conf v1.1 ##
# Native Windows monitoring only; coordinated shutdown is not configured.
UPSNAME main-ups
UPSCABLE usb
UPSTYPE usb
DEVICE
POLLTIME 10
SCRIPTDIR C:/ProgramData/apcupsd/etc/apcupsd
PWRFAILDIR C:/ProgramData/apcupsd/var
NOLOGINDIR C:/ProgramData/apcupsd/var
ONBATTERYDELAY 6
BATTERYLEVEL 0
MINUTES 0
TIMEOUT 0
NOLOGON disable
KILLDELAY 0
NETSERVER on
NISIP 127.0.0.1
NISPORT 3551
EVENTSFILE C:/ProgramData/apcupsd/var/log/apcupsd.events
EVENTSFILEMAX 100
UPSCLASS standalone
UPSMODE disable
STATTIME 0
LOGSTATS off
DATATIME 0
