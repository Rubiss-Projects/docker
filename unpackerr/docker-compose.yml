services:
  unpackerr:
    image: golift/unpackerr:latest@sha256:fc8b69571033f197d4db5cf22a573acb3bb891c9f8033431b9a1fcf679ca3e9c
    container_name: unpackerr
    volumes:
      - ./data:/config
      - ../../Media:/data
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      ## Sonarr Settings
      - UN_SONARR_0_URL=${UN_SONARR_0_URL}
      - UN_SONARR_0_API_KEY=${UN_SONARR_0_API_KEY}
      - UN_SONARR_0_PATHS_0=${UN_SONARR_0_PATHS_0}
      ## Radarr Settings
      - UN_RADARR_0_URL=${UN_RADARR_0_URL}
      - UN_RADARR_0_API_KEY=${UN_RADARR_0_API_KEY}
      - UN_RADARR_0_PATHS_0=${UN_RADARR_0_PATHS_0}
      ## Readarr Settings
      - UN_READARR_0_URL=${UN_READARR_0_URL}
      - UN_READARR_0_API_KEY=${UN_READARR_0_API_KEY}
      - UN_READARR_0_PATHS_0=${UN_READARR_0_PATHS_0}
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet