services:
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    container_name: snmp-exporter
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/auth.yml
      - --config.expand-environment-variables
      - --web.listen-address=:9116
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    volumes:
      - ./config/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
      - ./config/auth.yml:/etc/snmp_exporter/auth.yml:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9116/metrics]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [proxynet]
    # Access NAS metrics through the existing Grafana entry on Homepage.
    labels:
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://snmp-exporter:9116/metrics
      - swag.uptime-kuma.monitor.parent=Observability

networks:
  proxynet:
    external: true
    name: proxynet
