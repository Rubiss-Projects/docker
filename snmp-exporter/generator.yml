auths: {}
modules:
  qnap:
    walk:
      - QTS-MIB::systemCPU-Usage
      - QTS-MIB::cpuTemperature
      - QTS-MIB::systemTemperature
      - QTS-MIB::enclosureSystemTemp
      - QTS-MIB::diskTemperature
      - QTS-MIB::diskStatus
      - QTS-MIB::systemTotalMem
      - QTS-MIB::systemAvailableMem
      - QTS-MIB::sysFanSpeed
    lookups:
      - source_indexes: [diskIndex]
        lookup: QTS-MIB::diskSerialNumber
      - source_indexes: [diskIndex]
        lookup: QTS-MIB::diskID
      - source_indexes: [enclosureIndex]
        lookup: QTS-MIB::enclosureName
      - source_indexes: [sysFanIndex]
        lookup: QTS-MIB::sysFanDescr
    overrides:
      diskSerialNumber:
        type: DisplayString
        ignore: true
      diskID:
        ignore: true
      diskStatus:
        type: DisplayString
      enclosureName:
        type: DisplayString
        ignore: true
      sysFanDescr:
        type: DisplayString
        ignore: true
      # QNAP declares these as Counter64, but memory levels are gauges.
      systemTotalMem:
        type: gauge
      systemAvailableMem:
        type: gauge
    timeout: 5s
    retries: 1
  qnap_interfaces:
    walk:
      - IF-MIB::ifHCInOctets
      - IF-MIB::ifHCOutOctets
      - IF-MIB::ifHighSpeed
      - IF-MIB::ifOperStatus
    lookups:
      - source_indexes: [ifIndex]
        lookup: IF-MIB::ifName
    overrides:
      ifName:
        ignore: true
    timeout: 5s
    retries: 1
  qnap_storage:
    walk:
      - QTS-MIB::storagepoolCapacity
      - QTS-MIB::storagepoolFreeSize
      - QTS-MIB::storagepoolStatus
      - QTS-MIB::sharedFolderCapacity
      - QTS-MIB::sharedFolderFreeSize
      - QTS-MIB::sharedFolderStatus
    lookups:
      - source_indexes: [storagepoolIndex]
        lookup: QTS-MIB::storagepoolID
      - source_indexes: [sharedFolderIndex]
        lookup: QTS-MIB::sharedFolderName
    overrides:
      storagepoolID:
        ignore: true
      sharedFolderName:
        type: DisplayString
        ignore: true
      sharedFolderStatus:
        type: DisplayString
      # Capacity and free-space levels can fall; Counter64 is only their wire type.
      storagepoolCapacity:
        type: gauge
      storagepoolFreeSize:
        type: gauge
      sharedFolderCapacity:
        type: gauge
      sharedFolderFreeSize:
        type: gauge
    timeout: 5s
    retries: 1
