services:
  ollama:
    image: ollama/ollama:0.31.1
    container_name: ollama
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES}
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    volumes:
      - ./data:/root/.ollama
      # Explicitly mount WSL NVIDIA driver paths for GPU access
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    ports:
      - 11434:11434
    restart: unless-stopped
    labels:
      - homepage.group=AI & Automation
      - homepage.name=Ollama
      - homepage.icon=ollama.png
      - homepage.href=https://ollama.benlawson.dev/
      - homepage.description=Local LLM server
      - homepage.widget.type=ollama
      - homepage.widget.url=http://ollama:11434
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=AI & Automation
      - swag.uptime-kuma.monitor.url=https://ollama.benlawson.dev/
    networks:
      - proxynet
      - ollama-net

networks:
  proxynet:
    external: true
    name: proxynet
  ollama-net:
    external: true
    name: ollama-net
