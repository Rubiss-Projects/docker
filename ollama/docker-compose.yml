services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES}
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/root/.ollama
      # Explicitly mount WSL NVIDIA driver paths for GPU access
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    ports:
      - 11434:11434
    restart: unless-stopped
    labels:
      - homepage.group=AI & Automation
      - homepage.name=Ollama
      - homepage.icon=ollama.png
      - homepage.href=https://ollama.benlawson.dev/
      - homepage.description=Local LLM server
      - homepage.widget.type=ollama
      - homepage.widget.url=http://ollama:11434
      - swag_ondemand=enable
      - swag_ondemand_urls=https://ollama.,https://ai.
      - 'swag_server_custom_directive=include /config/nginx/ondemand.conf;'
    networks:
      - proxynet

networks:
  proxynet:
    external:
      name: proxynet
