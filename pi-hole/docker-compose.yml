# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
      - "8088:80/tcp"
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${WEBPASSWORD}
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - FTLCONF_dns_rateLimit_count=0
      - FTLCONF_dns_rateLimit_interval=0
    # Volumes store your data between container upgrades
    volumes:
      - E:\Docker\pi-hole\etc-pihole:/etc/pihole
      - E:\Docker\pi-hole\etc-dnsmasq.d:/etc/dnsmasq.d
    env_file:
      - .env
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Pi-hole
      - homepage.icon=pi-hole.png
      - homepage.href=https://dns.benlawson.dev/admin/
      - homepage.description=Network-wide ad blocker
      - homepage.widget.type=pihole
      - homepage.widget.url=http://pihole:80
      - homepage.widget.key=${HOMEPAGE_WIDGET_KEY}
      - homepage.widget.version=6
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    cap_add:
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
      - SYS_NICE  # Allows setting process priority
      - SYS_TIME  # Allows setting system time for NTP
    restart: unless-stopped
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet