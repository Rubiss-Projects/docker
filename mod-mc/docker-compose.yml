services:
  minecraft-server:
    image: itzg/minecraft-server:java17
    container_name: mod-mc
    volumes:
        - ./data:/data
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    environment:
      TYPE: FORGE
      VERSION: 1.19.2
      FORGE_VERSION: 43.2.6
      PACKWIZ_URL: https://raw.githubusercontent.com/Hdom/packwiz-ben-server/main/pack.toml
      EULA: "TRUE"
      OPS: MasterHdom
      ENABLE_WHITELIST: "true"
      MEMORY: 16G
    tty: true
    stdin_open: true
    restart: unless-stopped
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxynet
    labels:
      - homepage.group=Gaming
      - homepage.name=Modded Minecraft
      - homepage.icon=minecraft.png
      - homepage.description=Forge Modded Server
      - homepage.widget.type=minecraft
      - homepage.widget.url=udp://mod-mc:25565