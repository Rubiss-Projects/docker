version: "3"
services: 
  valheim: 
    image: lloesche/valheim-server
    cap_add:
      - sys_nice
    volumes: 
      - D:\Docker\valheim\config:/config
      - D:\Docker\valheim\data:/opt/valheim
    ports: 
      - "2456-2457:2456-2457/udp"
      - "9001:9001/tcp"
    env_file:
      - D:\Docker\valheim\valheim.env
    restart: always
    stop_grace_period: 2m