services:
  valheim:
    image: lloesche/valheim-server:latest@sha256:c885aa902faf885ceb8f69a34663b90519e65aa65fbd9f893451f0640e218a4f
    container_name: valheim
    cap_add:
      - sys_nice
    volumes:
      - ./config:/config
      - ./data:/opt/valheim
    ports:
      - "2456-2457:2456-2457/udp"
      - "9001:9001/tcp"
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    restart: unless-stopped
    stop_grace_period: 2m
    labels:
      - homepage.group=Gaming
      - homepage.name=Valheim
      - homepage.icon=/icons/valheim.png
      - homepage.description=Valheim Server
      - homepage.widget.type=gamedig
      - homepage.widget.serverType=valheim
      - homepage.widget.url=udp://valheim:2457
      - homepage.widget.fields=["status", "currentPlayers", "maxPlayers", "ping"]
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet
