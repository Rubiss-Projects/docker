services:
  bitwarden:
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    image: ghcr.io/bitwarden/self-host:beta
    container_name: bitwarden
    restart: unless-stopped
    ports:
      - "8083:8080"
      - "8084:8443"
    volumes:
      - ./config:/etc/bitwarden
      - ./logs:/var/log/bitwarden
    networks:
      - proxynet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Bitwarden"
      - "homepage.icon=bitwarden.png"
      - "homepage.href=https://bitwarden.benlawson.dev"
      - "homepage.description=Password Manager"
      - "homepage.siteMonitor=http://192.168.50.40:8083"

  db:
    container_name: bitwarden-db
    env_file:
      - db.env
    image: postgres:14
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - proxynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxynet:
    name: proxynet

volumes:
  bitwarden:
  logs:
  data: