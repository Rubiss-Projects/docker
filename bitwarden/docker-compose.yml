services:
  bitwarden:
    depends_on:
      - db
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    image: ghcr.io/bitwarden/lite:latest@sha256:616624bf9a2e1bae68a6a7735732339db41b831e38593846f0c2b4983af34bb9
    container_name: bitwarden
    restart: unless-stopped
    ports:
      - "8083:8080"
      - "8084:8443"
    volumes:
      - ./config:/etc/bitwarden
      - ./logs:/var/log/bitwarden
    networks:
      - proxynet
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Bitwarden"
      - "homepage.icon=bitwarden.png"
      - "homepage.href=https://bitwarden.benlawson.dev"
      - "homepage.description=Password Manager"
      - "homepage.siteMonitor=http://bitwarden:8080/alive"
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Infrastructure
      - swag.uptime-kuma.monitor.url=https://bitwarden.benlawson.dev/

  db:
    env_file:
      - path: db.env
      - path: db.env.secret
        required: false
    image: postgres:14@sha256:156f0b253fd61366d5fc2107ad45955027d5612f695a8436ce20167f3fa79bff
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet

volumes:
  bitwarden:
  logs:
  data:
  # Populate the existing cluster before deployment; a missing volume refuses startup.
  postgres_data:
    external: true
    name: bitwarden_postgres_data
