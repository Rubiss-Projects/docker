services:
  bitwarden:
    depends_on:
      - db
    env_file:
      - .env
    image: ghcr.io/bitwarden/self-host:beta
    container_name: bitwarden
    restart: unless-stopped
    ports:
      - "8083:8080"
      - "8084:8443"
    volumes:
      - ./config:/etc/bitwarden
      - ./logs:/var/log/bitwarden
    networks:
      - proxynet
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Bitwarden"
      - "homepage.icon=bitwarden.png"
      - "homepage.href=https://bitwarden.benlawson.dev"
      - "homepage.description=Password Manager"
      - "homepage.siteMonitor=http://192.168.50.40:8083"

  db:
    env_file:
      - db.env
    image: postgres:14
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet

volumes:
  bitwarden:
  logs:
  data: