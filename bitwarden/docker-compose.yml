services:
  bitwarden:
    depends_on:
      - db
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    image: ghcr.io/bitwarden/lite:latest@sha256:f42c5a256face5c59990d515e7d672ff4f029c6d03acb8f0cb0c5839cd27fe2a
    container_name: bitwarden
    # The image consumes these settings when creating its unprivileged app user.
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
    ports:
      - "8083:8080"
      - "8084:8443"
    volumes:
      - ./config:/etc/bitwarden
      - ./logs:/var/log/bitwarden
    networks:
      - proxynet
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Bitwarden"
      - "homepage.icon=bitwarden.png"
      - "homepage.href=https://bitwarden.benlawson.dev"
      - "homepage.description=Password Manager"
      - "homepage.siteMonitor=http://bitwarden:8080/alive"
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Infrastructure
      - swag.uptime-kuma.monitor.url=https://bitwarden.benlawson.dev/

  db:
    env_file:
      - path: db.env
      - path: db.env.secret
        required: false
    image: postgres:14@sha256:c2427de38f998489d36de7ca3553db2134872c400f2b08be4b824e5c50e4d619
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet

volumes:
  bitwarden:
  logs:
  data:
  # Populate the existing cluster before deployment; a missing volume refuses startup.
  postgres_data:
    external: true
    name: bitwarden_postgres_data
