services:
  classroom-librarian:
    image: rubiss/classroom-library:latest
    container_name: classroom-librarian
    restart: unless-stopped
    ports:
      - "4000:80"
    volumes:
      # Persist MongoDB data
      - mongo_data:/data/db
    environment:
      # JWT settings (change in production!)
      - Jwt__Secret=${JWT_KEY:-YourSuperSecretKeyThatShouldBeAtLeast32Characters!}
      - Jwt__Issuer=${JWT_ISSUER:-ClassroomLibrary}
      - Jwt__Audience=${JWT_AUDIENCE:-ClassroomLibraryUsers}
      - Jwt__ExpirationMinutes=${JWT_EXPIRE_MINUTES:-60}
      # Google Books API (optional - enables ISBN lookup for book metadata)
      # Get your free API key at: https://console.cloud.google.com/apis/library/books.googleapis.com
      - GoogleBooks__ApiKey=${GOOGLE_BOOKS_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Infrastructure
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet

volumes:
  mongo_data:
