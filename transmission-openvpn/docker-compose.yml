version: '3.3'
services:
    transmission-openvpn:
        cap_add:
            - NET_ADMIN
        volumes:
            - D:\Docker\transmission-openvpn\data\:/data
            - D:\Docker\plex\library\:/library
        environment:
            - OPENVPN_PROVIDER=NORDVPN
            # - OPENVPN_CONFIG=unitedstates
            - OPENVPN_USERNAME=TGhb45oJyA1VQnDhK2KcRT4N
            - OPENVPN_PASSWORD=***REDACTED***
            - LOCAL_NETWORK=192.168.0.0/16
            - NORDVPN_COUNTRY=US
            - NORDVPN_CATEGORY=legacy_p2p
            - NORDVPN_PROTOCOL=tcp
            - TRANSMISSION_DOWNLOAD_DIR=/library/movies
        logging:
            driver: json-file
            options:
                max-size: 10m
        ports:
            - '9091:9091'
        image: haugene/transmission-openvpn
        restart: unless-stopped