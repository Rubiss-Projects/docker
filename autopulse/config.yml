app:
  hostname: 0.0.0.0
  port: 2875
opts:
  check_path: true
  max_retries: 10
  default_timer_wait: 60
anchors:
  - /data/.autopulse.anchor
triggers:
  non-arr-video:
    type: notify
    backend: polling
    paths:
      - /data/channels-dvr
      - /data/videos
    recursive: true
    filters:
      - '(?i)\.(mkv|mp4|m4v|avi|mov|mpg|mpeg|ts|m2ts|wmv|webm)$'
    filter:
      exclude:
        - '^/data/channels-dvr/(Streaming|Logs|Images)(/|$)'
    excludes: [audiobookshelf]
  sonarr:
    type: sonarr
    excludes: [audiobookshelf]
  radarr:
    type: radarr
    excludes: [audiobookshelf]
  bookshelf:
    type: readarr
    excludes: [plex]
  bookshelf-audio:
    type: readarr
    excludes: [plex]
targets:
  plex:
    type: plex
    url: http://plex:32400
  audiobookshelf:
    type: audiobookshelf
    url: http://audiobookshelf:80
    rewrite:
      from: ^/data/
      to: /
    filter:
      include:
        - ^/(books|audiobooks)(/|$)
