app:
  hostname: 0.0.0.0
  port: 2875
opts:
  check_path: true
  max_retries: 10
  default_timer_wait: 60
anchors:
  - /data/.autopulse.anchor
triggers:
  sonarr:
    type: sonarr
    excludes: [audiobookshelf]
  radarr:
    type: radarr
    excludes: [audiobookshelf]
  bookshelf:
    type: readarr
    excludes: [plex]
  bookshelf-audio:
    type: readarr
    excludes: [plex]
targets:
  plex:
    type: plex
    url: http://plex:32400
  audiobookshelf:
    type: audiobookshelf
    url: http://audiobookshelf:80
    rewrite:
      from: ^/data/
      to: /
    filter:
      include:
        - ^/(books|audiobooks)(/|$)
