version: 2
registries:
  sunday-edge-ghcr:
    type: docker-registry
    url: https://ghcr.io
    username: Rubiss
    password: ${{secrets.SUNDAY_EDGE_GHCR_TOKEN}}
# Spread registry requests across Saturday morning; keep each new entry in its own slot.
updates:
  - package-ecosystem: docker-compose
    directory: /sunday-edge
    registries: [sunday-edge-ghcr]
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
      include: scope
    labels: [dependencies, docker-compose]
    groups:
      sunday-edge-images:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /ai-assistant
