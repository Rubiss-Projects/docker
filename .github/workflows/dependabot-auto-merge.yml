name: Dependabot Auto-Merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enable-automerge:
    name: Enable Dependabot auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'Rubiss-Projects/docker' && github.actor == 'dependabot[bot]' && github.event.sender.login == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false

    steps:
      - name: Classify dependency update
        id: classify
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          body = pr.get("body") or ""
          title = pr.get("title") or ""

          update_pairs = re.findall(r"Updates `[^`]+` from ([^`\s]+) to ([^`\s]+)", body)
          version_pattern = re.compile(r"^(?:version-)?v?(\d+)\.(\d+)\.(\d+)(?:[-+][0-9A-Za-z._-]+)?$")
          date_pattern = re.compile(r"^(\d{4})-(\d{2})-(\d{2})$")
          latest_pattern = re.compile(r"^latest-(\d+)$")

          reasons = []
          update_types = []

          if not update_pairs:
              reasons.append("no Dependabot update pairs found")

          for old, new in update_pairs:
              if old == new:
                  update_types.append("digest")
                  continue

              old_match = version_pattern.fullmatch(old)
              new_match = version_pattern.fullmatch(new)
              if old_match and new_match:
                  old_version = tuple(int(part) for part in old_match.groups())
                  new_version = tuple(int(part) for part in new_match.groups())

                  if new_version <= old_version:
                      reasons.append(f"{old} -> {new} is not an upgrade")
                  elif new_version[0] != old_version[0]:
                      reasons.append(f"{old} -> {new} is a major update")
                  elif new_version[1] != old_version[1]:
                      update_types.append("minor")
                  else:
                      update_types.append("patch")
                  continue

              old_date = date_pattern.fullmatch(old)
              new_date = date_pattern.fullmatch(new)
              if old_date and new_date:
                  old_version = tuple(int(part) for part in old_date.groups())
                  new_version = tuple(int(part) for part in new_date.groups())
                  if new_version > old_version:
                      update_types.append("calendar")
                  else:
                      reasons.append(f"{old} -> {new} is not a forward calendar update")
                  continue

              old_latest = latest_pattern.fullmatch(old)
              new_latest = latest_pattern.fullmatch(new)
              if old_latest and new_latest:
                  if int(new_latest.group(1)) > int(old_latest.group(1)):
                      update_types.append("build")
                  else:
                      reasons.append(f"{old} -> {new} is not a forward build update")
                  continue

              reasons.append(f"{old} -> {new} is not a supported version format")

          eligible = bool(update_pairs) and not reasons and all(
              update_type in {"minor", "patch", "digest", "calendar", "build"} for update_type in update_types
          )

          print(f"eligible={'true' if eligible else 'false'}")
          print(f"summary={'; '.join(update_types) if update_types else title}")
          if reasons:
              print(f"reason={'; '.join(reasons)}")
          PY

      - name: Report skipped update
        if: steps.classify.outputs.eligible != 'true'
        shell: bash
        run: |
          printf 'Skipping auto-merge: %s\n' "${{ steps.classify.outputs.reason }}"

      - name: Enable GitHub auto-merge
        if: steps.classify.outputs.eligible == 'true'
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            printf '::error::DEPENDABOT_AUTOMERGE_TOKEN secret is required so auto-merges trigger deploy workflows\n'
            exit 1
          fi

          gh pr merge --auto --rebase "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
