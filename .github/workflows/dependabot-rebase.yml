name: Dependabot Rebase

on:
  push:
    branches:
      - main
  schedule:
    # Pick up newly opened updates and retry an interrupted queue every hour.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-rebase-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  request-rebases:
    name: Request Dependabot rebases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'Rubiss-Projects/docker' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Request stale Dependabot rebases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            printf '::error::DEPENDABOT_AUTOMERGE_TOKEN secret is required to request Dependabot rebases\n'
            exit 1
          fi

          sleep 30

          # Do not start the next update until the current main deployment is healthy.
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ['REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))

          for attempt in range(32):
              main = api('branches/main')['commit']['sha']
              runs = api('actions/workflows/deploy-service-changes.yml/runs?branch=main&per_page=30')['workflow_runs']
              current = next((r for r in runs if r['head_sha'] == main), None)
              busy = any(r['status'] != 'completed' for r in runs)
              if current and current['status'] == 'completed' and not busy:
                  if current['conclusion'] != 'success':
                      raise SystemExit('Latest main deployment failed; leaving dependency updates paused')
                  break
              if attempt == 31:
                  raise SystemExit('Deployment is still pending; retry the rebase workflow after it finishes')
              time.sleep(15)
          PY

          prs_json="$RUNNER_TEMP/dependabot-prs.json"
          rebase_list="$RUNNER_TEMP/dependabot-rebase-prs.txt"
          gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --author app/dependabot \
            --json number,body,mergeStateStatus,headRefOid,autoMergeRequest,isDraft \
            --limit 100 > "$prs_json"

          python3 - "$prs_json" > "$rebase_list" <<'PY'
          import json
          import re
          import sys
          import os
          import subprocess
          from pathlib import Path

          prs = json.loads(Path(sys.argv[1]).read_text())
          update_pattern = re.compile(r"Updates `[^`]+` from ([^`\s]+) to ([^`\s]+)")
          version_pattern = re.compile(r"^(?:version-)?v?(\d+)\.(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:[-+][0-9A-Za-z._-]+)?$")
          date_pattern = re.compile(r"^(\d{4})-(\d{2})-(\d{2})$")
          latest_pattern = re.compile(r"^latest-(\d+)$")

          def eligible(pr):
              if pr.get('isDraft'):
                  return False
              update_pairs = update_pattern.findall(pr.get("body") or "")
              if not update_pairs:
                  return False

              for old, new in update_pairs:
                  if old == new:
                      continue

                  old_match = version_pattern.fullmatch(old)
                  new_match = version_pattern.fullmatch(new)
                  if old_match and new_match:
                      old_version = tuple(int(part or 0) for part in old_match.groups())
                      new_version = tuple(int(part or 0) for part in new_match.groups())
                      if new_version <= old_version or new_version[0] != old_version[0]:
                          return False
                      continue

                  old_date = date_pattern.fullmatch(old)
                  new_date = date_pattern.fullmatch(new)
                  if old_date and new_date:
                      old_version = tuple(int(part) for part in old_date.groups())
                      new_version = tuple(int(part) for part in new_date.groups())
                      if new_version <= old_version:
                          return False
                      continue

                  old_latest = latest_pattern.fullmatch(old)
                  new_latest = latest_pattern.fullmatch(new)
                  if old_latest and new_latest:
                      if int(new_latest.group(1)) <= int(old_latest.group(1)):
                          return False
                      continue

                  return False

              return True

          repo = os.environ['REPOSITORY']
          main_sha = subprocess.check_output(['gh', 'api', f'repos/{repo}/branches/main', '--jq', '.commit.sha'], text=True).strip()
          # GitHub can temporarily report UNKNOWN after a merge. Compare commit
          # ancestry instead, and rebase only one PR per successful deployment.
          candidates = sorted((pr for pr in prs if eligible(pr)), key=lambda pr: pr['number'])
          selected = candidates[0] if candidates else None
          # Dependabot may rebase other PRs automatically. Only this queue can
          # grant merge eligibility, so those rebases cannot bypass deployment.
          for pr in prs:
              if pr.get('autoMergeRequest') and (not selected or pr['number'] != selected['number']):
                  subprocess.run(['gh', 'pr', 'merge', str(pr['number']), '--repo', repo, '--disable-auto'], check=True, stdout=sys.stderr)
          if selected:
              pr = selected
              behind = int(subprocess.check_output([
                  'gh', 'api', f'repos/{repo}/compare/{main_sha}...{pr["headRefOid"]}',
                  '--jq', '.behind_by'], text=True).strip())
              subprocess.run(['gh', 'pr', 'merge', str(pr['number']), '--repo', repo,
                              '--auto', '--rebase', '--match-head-commit', pr['headRefOid']], check=True, stdout=sys.stderr)
              if behind > 0:
                  print(pr['number'])
              else:
                  print(f'PR #{pr["number"]} is current; waiting for its checks/auto-merge', file=sys.stderr)
          PY

          if [[ ! -s "$rebase_list" ]]; then
            printf 'No stale eligible Dependabot PRs need rebase requests\n'
            exit 0
          fi

          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            printf 'Requesting Dependabot rebase for PR #%s\n' "$pr_number"
            gh pr comment "$pr_number" --repo "$REPOSITORY" --body '@dependabot rebase'
          done < "$rebase_list"
