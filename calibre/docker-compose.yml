services:
  calibre:
    image: lscr.io/linuxserver/calibre:version-v9.14.0@sha256:aab1217345dd3f1f25aa0182cefa41909316fd44eb1e914e9836f79f44208b1f
    container_name: calibre
    security_opt:
      - seccomp:unconfined # Required for GUI apps
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PASSWORD=${CALIBRE_PASSWORD}
      - CLI_ARGS= # Optional Calibre CLI arguments
    volumes:
      - ./config:/config
      - ./custom-services.d:/custom-services.d:ro
      - ../../Media/books:/books
    ports:
      - 8090:8080   # Calibre desktop GUI (HTTP)
      - 8091:8181   # Calibre desktop GUI (HTTPS)
      - 8092:8081   # Calibre Content Server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - proxynet
    labels:
      - homepage.group=Media Consumption
      - homepage.name=Calibre
      - homepage.icon=calibre.png
      - homepage.href=https://calibre.benlawson.dev/
      - homepage.description=Ebook library management
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Media Consumption
      - swag.uptime-kuma.monitor.accepted_statuscodes=200-299,401

networks:
  proxynet:
    external: true
    name: proxynet
