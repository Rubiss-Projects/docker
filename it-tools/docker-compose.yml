services:
  it-tools:
    image: corentinth/it-tools:2024.10.22-7ca5933
    container_name: it-tools
    ports:
      - "8686:80"
    restart: unless-stopped
    networks:
      - proxynet
    labels:
      - homepage.group=Infrastructure
      - homepage.name=IT Tools
      - homepage.icon=it-tools.png
      - homepage.href=https://it-tools.benlawson.dev/
      - homepage.siteMonitor=http://it-tools:80
      - homepage.description=Collection of handy online tools for developers
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://it-tools:80
      - swag.uptime-kuma.monitor.parent=Infrastructure

networks:
  proxynet:
    external: true
    name: proxynet
