---
version: "3.8"
services:
  swag:
    image: lscr.io/linuxserver/swag:version-5.8.0@sha256:2fc60133a4c153a7182fdf7700ae72c6a31447fe263baf02851466c33a5111f0
    container_name: swag
    cap_add:
      - NET_ADMIN
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - URL=${URL}
      - SUBDOMAINS=${SUBDOMAINS}
      - VALIDATION=${VALIDATION}
      - DNSPLUGIN=${DNSPLUGIN}
      - PROPAGATION=${PROPAGATION}
      - CERTPROVIDER=${CERTPROVIDER}
      - EMAIL=${EMAIL}
      - STAGING=${STAGING}
      - DISABLE_F2B=${DISABLE_F2B}
      - SWAG_AUTORELOAD=${SWAG_AUTORELOAD}
      - DOCKER_MODS=linuxserver/mods:swag-dashboard|linuxserver/mods:swag-ondemand|linuxserver/mods:universal-docker|linuxserver/mods:swag-auto-uptime-kuma
      - DOCKER_HOST=tcp://socket-proxy:2375
      - UPTIME_KUMA_URL=http://uptime-kuma:3001/
      - UPTIME_KUMA_API_VERSION=2
    volumes:
      - ./config:/config
      # Patch the reviewed Kuma client race before its mod attempts login.
      - ./init/kuma-initial-info:/etc/s6-overlay/s6-rc.d/init-kuma-initial-info:ro
      - ./init/kuma-required:/etc/s6-overlay/s6-rc.d/init-mod-swag-auto-uptime-kuma-install/dependencies.d/init-kuma-initial-info:ro
    ports:
      - "443:443"   # SWAG HTTPS port (standard)
      - "80:80"     # SWAG HTTP port (standard)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - homepage.group=Infrastructure
      - homepage.name=SWAG Dashboard
      - homepage.icon=nginx.png
      - homepage.href=https://dashboard.benlawson.dev/
      - homepage.description=Nginx reverse proxy with analytics
      - homepage.widget.type=swagdashboard
      - homepage.widget.url=https://dashboard.benlawson.dev
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Infrastructure
      - swag.uptime-kuma.monitor.url=https://dashboard.benlawson.dev/icon.svg
    networks:
      - socket-proxy-net  # For Docker socket access via proxy
      - proxynet          # For routing to backend services

networks:
  socket-proxy-net:
    external: true
    name: socket-proxy-net
  proxynet:
    external: true
    name: proxynet
