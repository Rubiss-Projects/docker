---
version: "3.8"
services:
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - URL=${URL}
      - SUBDOMAINS=${SUBDOMAINS}
      - VALIDATION=${VALIDATION}
      - DNSPLUGIN=${DNSPLUGIN}
      - EMAIL=${EMAIL}
      - STAGING=${STAGING}
      - DISABLE_F2B=${DISABLE_F2B}
      - SWAG_AUTORELOAD=${SWAG_AUTORELOAD}
      - DOCKER_MODS=linuxserver/mods:swag-dashboard|linuxserver/mods:swag-ondemand
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./config:/config
    ports:
      - "443:443"   # SWAG HTTPS port (standard)
      - "80:80"     # SWAG HTTP port (standard)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=Infrastructure
      - homepage.name=SWAG Dashboard
      - homepage.icon=nginx.png
      - homepage.href=https://dashboard.benlawson.dev/
      - homepage.description=Nginx reverse proxy with analytics
      - homepage.widget.type=swagdashboard
      - homepage.widget.url=https://dashboard.benlawson.dev
    networks:
      - socket-proxy-net  # For Docker socket access via proxy
      - proxynet          # For routing to backend services

networks:
  socket-proxy-net:
    external: true
    name: socket-proxy-net
  proxynet:
    external: true
    name: proxynet
