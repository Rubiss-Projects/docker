# Private Caddy -> SWAG -> Channels hop. No DNS alias or router forward.
# Docker Desktop hides the actual peer: only native Caddy enforces the LAN CIDR.
# A missing generated key leaves every request denied, including on public 443.
map $http_x_channels_lan_key $channels_lan_authorized {
    default 0;
    include /config/nginx/channels-lan-private/*.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name channels-lan-relay.benlawson.dev;
    include /config/nginx/ssl.conf;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 0;
    if ($channels_lan_authorized != 1) { return 403; }

    location / {
        include /config/nginx/resolver.conf;
        set $channels_upstream channels-dvr:8089;
        proxy_pass http://$channels_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.50.40:18089;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        # Do not include proxy.conf: its forwarded headers re-enable remote auth.
        # This is an ordinary internal request, never X-DVR-SkipAuth bypass.
        proxy_set_header X-Channels-Lan-Key "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-DVR-SkipAuth "";
        proxy_set_header X-DVR-ForceAuth "";
        proxy_set_header Proxy "";
        proxy_set_header Proxy-Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }
}
