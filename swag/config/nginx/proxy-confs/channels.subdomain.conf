## Version 2025/11/29
# Channels DVR proxy configuration
# make sure that your channels-dvr container is named channels-dvr
# make sure that your dns has a cname set for channels

map $http_accept $channels_accept_encoding {
    default $http_accept_encoding;
    ~*text/html "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name channels.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location ^~ /channels-player/ {
        alias /config/www/channels-player/;
        expires 1h;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app channels-dvr;
        set $upstream_port 8089;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Replace the legacy browser HLS handler after Channels loads its UI.
        # Applies to HTML only; stream responses and native TV clients are untouched.
        proxy_set_header Accept-Encoding $channels_accept_encoding;
        sub_filter '</body>' '<script>window.ChannelsLegacyHls=window.Hls;</script><script src="/channels-player/hls-1.6.19.min.js"></script><script src="/channels-player/compat-v1.js"></script></body>';

        # WebSocket support for live TV streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
