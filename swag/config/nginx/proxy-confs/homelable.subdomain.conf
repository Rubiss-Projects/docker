# Private management listener shared with NAS. Never forward 4443 publicly.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name homelable.benlawson.dev;
    include /config/nginx/ssl.conf;
    return 302 https://homelable.benlawson.dev:4443$request_uri;
}

server {
    listen 4443 ssl;
    server_name homelable.benlawson.dev;
    include /config/nginx/ssl.conf;
    if ($host != homelable.benlawson.dev) { return 444; }
    if ($http_cf_ray != "") { return 403; }
    client_max_body_size 20m;

    location / {
        include /config/nginx/resolver.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Proxy "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        set $upstream_app homelable;
        proxy_pass http://$upstream_app:80;
    }
}
