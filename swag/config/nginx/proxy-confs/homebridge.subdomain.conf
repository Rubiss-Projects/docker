## Version 2025/11/29 - Custom config for external Homebridge
# Proxies to external Homebridge instance at 192.168.50.216:8581
# Based on official sample but modified for external IP

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name homebridge.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app 192.168.50.216;  # External IP - not Docker container
        set $upstream_port 8581;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
