## Version 2026/10/15
# DNS points at Ben-server. The router forwards 443, so it only redirects here.
# Port 4443 is bound to Ben-server's LAN address and must not be forwarded publicly.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name nas.benlawson.dev;

    include /config/nginx/ssl.conf;

    return 302 https://nas.benlawson.dev:4443$request_uri;
}

server {
    listen 4443 ssl;

    server_name nas.benlawson.dev;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # This is the only virtual host on 4443; reject unmatched Host headers.
    if ($host != nas.benlawson.dev) {
        return 444;
    }

    # Guard against accidental Cloudflare ingress to this private management port.
    if ($http_cf_ray != "") {
        return 403;
    }

    location / {
        # Preserve :4443 in Host; the shared proxy.conf strips nonstandard ports.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Proxy "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_pass http://192.168.50.91:8080;
    }
}
