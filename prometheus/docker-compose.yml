services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus/data"
    ports:
      - 9090:9090
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./config:/etc/prometheus
      - prometheus_data:/prometheus
    labels:
      - homepage.group=Observability
      - homepage.name=Prometheus
      - homepage.icon=prometheus.png
      - homepage.href=https://prometheus.benlawson.dev/
      - homepage.siteMonitor=http://prometheus:9090/-/healthy
      - homepage.description=Metrics database
      - homepage.widget.type=prometheus
      - homepage.widget.url=http://prometheus:9090
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Observability
      - swag.uptime-kuma.monitor.url=https://prometheus.benlawson.dev/-/healthy
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet

volumes:
  # Preserve the existing data/ child when copying the old ./data directory.
  prometheus_data:
    external: true
    name: prometheus_data
