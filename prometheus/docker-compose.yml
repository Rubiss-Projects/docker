services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config:/etc/prometheus
      - ./data:/prometheus
    labels:
      - homepage.group=Observability
      - homepage.name=Prometheus
      - homepage.icon=prometheus.png
      - homepage.href=https://prometheus.benlawson.dev/
      - homepage.siteMonitor=http://prometheus:9090/-/healthy
      - homepage.description=Metrics database
      - homepage.widget.type=prometheus
      - homepage.widget.url=http://prometheus:9090
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet