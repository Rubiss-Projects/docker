# Observations only. The native and NAS power clients remain the shutdown owners.
# Stable recording names preserve existing APC dashboard links and history.
groups:
- name: nut-telemetry
  interval: 5s
  rules:
  - record: nut:telemetry_available
    expr: max(upsd_telemetry_valid{job="native-ups"} and (time() - timestamp(upsd_telemetry_valid{job="native-ups"})
      < 30) and on(job, instance) (up{job="native-ups"} == 1) and on(job, instance) (time() - timestamp(up{job="native-ups"})
      < 30)) or vector(0)
  - record: nut:ups_status
    expr: (label_replace(max by(job, instance) (upsd_online{job="native-ups"} and (time() - timestamp(upsd_online{job="native-ups"})
      < 30)), "flag", "OL", "", "") or label_replace(max by(job, instance) (upsd_on_battery{job="native-ups"} and (time()
      - timestamp(upsd_on_battery{job="native-ups"}) < 30)), "flag", "OB", "", "") or label_replace(max by(job, instance)
      (upsd_low_battery{job="native-ups"} and (time() - timestamp(upsd_low_battery{job="native-ups"}) < 30)), "flag",
      "LB", "", "")) and on() (nut:telemetry_available == 1)
  - record: nut:battery_charge_percent
    expr: (max by(job, instance) (upsd_battery_charge_percent{job="native-ups"} and (time() - timestamp(upsd_battery_charge_percent{job="native-ups"})
      < 30))) and on() (nut:telemetry_available == 1)
  - record: nut:battery_runtime_seconds
    expr: (max by(job, instance) (upsd_time_left_ns{job="native-ups"} and (time() - timestamp(upsd_time_left_ns{job="native-ups"})
      < 30)) / 1000000000) and on() (nut:telemetry_available == 1)
  - record: nut:load_percent
    expr: (max by(job, instance) (upsd_load_percent{job="native-ups"} and (time() - timestamp(upsd_load_percent{job="native-ups"})
      < 30))) and on() (nut:telemetry_available == 1)
  - record: nut:nominal_watts
    expr: (max by(job, instance) (upsd_nominal_power{job="native-ups"} and (time() - timestamp(upsd_nominal_power{job="native-ups"})
      < 30))) and on() (nut:telemetry_available == 1)
  - record: nut:critical_status
    expr: (max by(job, instance) (upsd_critical_status{job="native-ups"} and (time() - timestamp(upsd_critical_status{job="native-ups"})
      < 30))) and on() (nut:telemetry_available == 1)
  - record: nut:estimated_load_watts
    expr: nut:load_percent * on(job, instance) nut:nominal_watts / 100
