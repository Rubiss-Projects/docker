# my global config
global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'ben-server'

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.

  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 15s

    static_configs:
         - targets: ['prometheus:9090']

  - job_name: 'cadvisor'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 15s

    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'autobrr'
    scrape_interval: 15s
    static_configs:
      - targets: ['autobrr:9074']

  # Raspberry Pi - Container metrics
  - job_name: 'cadvisor-pi'
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.50.216:8080']
        labels:
          instance: 'raspberry-pi'
          host: 'pi3'

  # Raspberry Pi - System metrics
  - job_name: 'node-exporter-pi'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.50.216:9100']
        labels:
          instance: 'raspberry-pi'
          host: 'pi3'

  # Docker DNS returns every Compose replica; never scrape a load-balanced
  # service hostname as a single target or assume a fixed six-container pool.
  - job_name: sunday-edge-dfs-workers
    scrape_interval: 10s
    scrape_timeout: 5s
    dns_sd_configs:
      - names: [sunday-edge-dfs]
        type: A
        port: 9460
        refresh_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: sunday-edge-dfs-simulator
      - target_label: host
        replacement: ben-server

  - job_name: sunday-edge-dfs-checkpoint-recovery
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - sunday-edge-checkpoint-recovery:9460
        labels:
          service: sunday-edge-dfs-simulator
          host: ben-server

  - job_name: sunday-edge-services
    scrape_interval: 15s
    static_configs:
      - targets: [sunday-edge:9460]
        labels: { service: sunday-edge, role: watchdog, host: ben-server }
      - targets: [sunday-edge-analytics:9460]
        labels: { service: sunday-edge, role: analytics, host: ben-server }
      - targets: [sunday-edge-maintenance:9460]
        labels: { service: sunday-edge, role: maintenance, host: ben-server }
      - targets: [sunday-edge-research:9460]
        labels: { service: sunday-edge, role: research, host: ben-server }
