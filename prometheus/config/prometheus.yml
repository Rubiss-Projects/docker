# my global config
global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'ben-server'

rule_files:
  - /etc/prometheus/nut-recording-rules.yml

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.

  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 15s

    static_configs:
         - targets: ['prometheus:9090']

  - job_name: 'cadvisor'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 15s

    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'autobrr'
    scrape_interval: 15s
    static_configs:
      - targets: ['autobrr:9074']

  # Native Telegraf reads the locally attached UPS; power protection is separate.
  - job_name: native-ups
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['192.168.50.40:9273']
        labels:
          instance: ben-server-ups
    metric_relabel_configs:
      - action: labeldrop
        regex: serial

  # Read-only NAS telemetry. No disk tests or recovery actions are triggered.
  - job_name: qnap-snmp
    scrape_interval: 60s
    scrape_timeout: 45s
    metrics_path: /snmp
    params:
      auth: [qnap_v3]
      module: [qnap, qnap_interfaces, qnap_storage]
    static_configs:
      - targets: ['192.168.50.91']
        labels:
          instance: qnap-nas
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: snmp-exporter:9116
    metric_relabel_configs:
      # SNMP diskID includes the two M.2 slots; it is not the SATA bay number.
      # Require both native ID and recorded serial so a move/replacement is visible.
      - source_labels: [__name__]
        regex: 'disk(Status|Temperature)'
        target_label: bay
        replacement: unmapped
      - source_labels: [diskID, diskSerialNumber]
        regex: '3;ZR90KK6H'
        target_label: bay
        replacement: '1'
      - source_labels: [diskID, diskSerialNumber]
        regex: '4;ZR90KJ5M'
        target_label: bay
        replacement: '2'
      - source_labels: [diskID, diskSerialNumber]
        regex: '5;K3S069D7'
        target_label: bay
        replacement: '3'
      - source_labels: [diskID, diskSerialNumber]
        regex: '6;K3S04HPB'
        target_label: bay
        replacement: '4'

  # Raspberry Pi - Container metrics
  - job_name: 'cadvisor-pi'
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.50.216:8080']
        labels:
          instance: 'raspberry-pi'
          host: 'pi3'

  # Native host - same Node Exporter Full dashboard and alerts as the Pi.
  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.50.40:9100']
        labels:
          instance: ben-server
          host: ben-server

  # Raspberry Pi - System metrics
  - job_name: 'node-exporter-pi'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.50.216:9100']
        labels:
          instance: 'raspberry-pi'
          host: 'pi3'

  # Docker DNS returns every Compose replica; never scrape a load-balanced
  # service hostname as a single target or assume a fixed six-container pool.
  - job_name: sunday-edge-dfs-workers
    scrape_interval: 10s
    scrape_timeout: 5s
    dns_sd_configs:
      - names: [sunday-edge-dfs]
        type: A
        port: 9460
        refresh_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: sunday-edge-dfs-simulator
      - target_label: host
        replacement: ben-server

  - job_name: sunday-edge-dfs-checkpoint-recovery
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - sunday-edge-checkpoint-recovery:9460
        labels:
          service: sunday-edge-dfs-simulator
          host: ben-server

  - job_name: sunday-edge-services
    scrape_interval: 15s
    static_configs:
      - targets: [sunday-edge:9460]
        labels: { service: sunday-edge, role: watchdog, host: ben-server }
      - targets: [sunday-edge-analytics:9460]
        labels: { service: sunday-edge, role: analytics, host: ben-server }
      - targets: [sunday-edge-maintenance:9460]
        labels: { service: sunday-edge, role: maintenance, host: ben-server }
      - targets: [sunday-edge-research:9460]
        labels: { service: sunday-edge, role: research, host: ben-server }
