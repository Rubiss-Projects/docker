services:
  grafana:
    image: grafana/grafana:13.2@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    environment:
      - TZ=America/Los_Angeles
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    ports:
      - 3000:3000
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/dashboards:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    labels:
      - homepage.group=Observability
      - homepage.name=Grafana
      - homepage.icon=grafana.png
      - homepage.href=https://grafana.benlawson.dev/
      - homepage.siteMonitor=http://grafana:3000/healthz
      - homepage.description=Metric visualizations
      - homepage.widget.type=grafana
      - homepage.widget.url=http://grafana:3000
      - homepage.widget.username=rubiss
      - homepage.widget.password=${GRAFANA_PASSWORD}
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Observability
      - swag.uptime-kuma.monitor.url=https://grafana.benlawson.dev/healthz
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet

volumes:
  # Populate and verify the existing state before deploying this change.
  grafana_data:
    external: true
    name: grafana_data
