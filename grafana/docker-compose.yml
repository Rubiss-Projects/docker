services:
  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - UMASK_SET=022
    ports:
      - 3000:3000
    volumes:
      - ./data:/var/lib/grafana
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=Observability
      - homepage.name=Grafana
      - homepage.icon=grafana.png
      - homepage.href=https://grafana.benlawson.dev/
      - homepage.siteMonitor=http://grafana:3000/healthz
      - homepage.description=Metric visualizations
      - homepage.widget.type=grafana
      - homepage.widget.url=http://grafana:3000
      - homepage.widget.username=rubiss
      - homepage.widget.password=${GRAFANA_PASSWORD}
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet