apiVersion: 1
policies:
- orgId: 1
  receiver: Discord - Lawson
  group_by:
  - grafana_folder
  - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  # Power alerts must not wait through the native guard's 30-second deadline.
  - receiver: Discord - Lawson
    object_matchers:
    - [service, '=', ups]
    group_by: [alertname]
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 4h
  - receiver: Discord - Lawson
    object_matchers:
    - - service
      - '='
      - transmission
    group_by:
    - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
  - receiver: Discord - Sunday Edge Admin
    object_matchers:
    - - service
      - '='
      - sunday-edge-dfs-simulator
    group_by:
    - alertname
    - instance
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
