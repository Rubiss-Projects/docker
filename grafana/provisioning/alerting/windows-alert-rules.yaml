              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1000000000
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: fdvyllsgg8v7kf
        panelId: 10
        noDataState: OK
        execErrState: Error
        for: 5m
        # Apply the same recovery hold if memory hovers around the critical boundary.
        keepFiringFor: 15m
        annotations:
          __dashboardUid__: fdvyllsgg8v7kf
          __panelId__: "10"
          summary: "Windows memory free CRITICAL on {{ $labels.host }}"
          description: "Available memory is below 1GB on {{ $labels.host }}. Current value: {{ $values.B.Value | humanize1024 }}B"
        labels:
          monitor: windows
          resource: memory
          severity: critical
        isPaused: false

