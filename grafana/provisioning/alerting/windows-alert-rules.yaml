apiVersion: 1

groups:
  - orgId: 1
    name: windows-dashboard
    folder: Windows
    interval: 1m
    rules:
      - uid: windows_memory_free_warning
        title: Windows memory free low (warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ddvyigh44dblsd
            model:
              datasource:
                type: influxdb
                uid: ddvyigh44dblsd
              refId: A
              resultFormat: time_series
              policy: default
              rawQuery: true
              query: "SELECT mean(\"Available_Bytes\") AS \"Available_Bytes\" FROM \"win_mem\" WHERE $timeFilter GROUP BY time(1m), host fill(null)"
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2000000000
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: fdvyllsgg8v7kf
        panelId: 5
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          __dashboardUid__: fdvyllsgg8v7kf
          __panelId__: "5"
          summary: "Windows memory free low on {{ $labels.host }}"
          description: "Available memory is below 2GB on {{ $labels.host }}. Current value: {{ $values.B.Value | humanize1024 }}B"
        labels:
          monitor: windows
          resource: memory
          severity: warning
        isPaused: false

