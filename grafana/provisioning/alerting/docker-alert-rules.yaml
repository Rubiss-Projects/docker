apiVersion: 1

groups:
  - orgId: 1
    name: docker-containers
    folder: Docker
    interval: 1m
    rules:
      - uid: docker_container_restarting
        title: Docker Container Restarting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: adw07verg2qrkd
            model:
              expr: increase(container_start_time_seconds{name!=""}[15m])
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
        for: 0m
        dashboardUid: fdw07wwnc7y0wa
        panelId: 3
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: fdw07wwnc7y0wa
          __panelId__: "3"
          summary: "Container {{ $labels.name }} is restarting"
          description: "Container {{ $labels.name }} has restarted {{ $values.B.Value }} times in the last 15 minutes."
        labels:
          condition: container-restart-loop
          severity: warning

      - uid: docker_container_memory_high
        title: Docker Container High Memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: adw07verg2qrkd
            model:
              expr: container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0) * 100
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
        for: 5m
        dashboardUid: fdw07wwnc7y0wa
        panelId: 2
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: fdw07wwnc7y0wa
          __panelId__: "2"
          summary: "High memory usage (working set) in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} working set is using {{ $values.B.Value | printf \"%.2f\" }}% of its memory limit. This metric excludes reclaimable cache."
        labels:
          severity: warning

      - uid: docker_container_memory_critical
        title: Docker Container Critical Memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: adw07verg2qrkd
            model:
              expr: container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0) * 100
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params: [98]
                    type: gt
                  operator:
                    type: and
        for: 2m
        dashboardUid: fdw07wwnc7y0wa
        panelId: 2
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: fdw07wwnc7y0wa
          __panelId__: "2"
          summary: "CRITICAL memory usage in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} working set is at {{ $values.B.Value | printf \"%.2f\" }}%. OOM kill is imminent."
        labels:
          severity: critical

      - uid: docker_container_oom_killed
        title: Docker Container OOM Killed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: adw07verg2qrkd
            model:
              expr: increase(container_oom_events_total{name!=""}[5m])
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
        for: 0m
        dashboardUid: fdw07wwnc7y0wa
        panelId: 2
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: fdw07wwnc7y0wa
          __panelId__: "2"
          summary: "Container {{ $labels.name }} OOM killed"
          description: "Container {{ $labels.name }} has been killed by the kernel due to out-of-memory conditions."
        labels:
          condition: container-oom
          severity: critical
