apiVersion: 1
groups:
- orgId: 1
  name: native-host
  folder: Linux
  interval: 1m
  rules:
  - uid: native_host_telemetry_missing
    title: Native host telemetry missing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource: &id001
          type: influxdb
          uid: ddvyigh44dblsd
        rawQuery: true
        query: SELECT count("uptime") FROM "system" WHERE $timeFilter AND "host" =
          'ben-server' AND "platform" = 'native_linux'
        resultFormat: time_series
        policy: default
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
    for: 2m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Native host telemetry missing
      description: Native Linux host observation. Check the host, collector and monitoring
        database. Missing data is unknown; this alert does not restart services.
      __dashboardUid__: native-linux-host
      __panelId__: '7'
    labels:
      severity: critical
      host: ben-server
      platform: native_linux
  - uid: native_host_cpu_high
    title: Native host CPU usage high
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource: *id001
        rawQuery: true
        query: SELECT 100 - mean("usage_idle") FROM "cpu" WHERE $timeFilter AND "host"
          = 'ben-server' AND "platform" = 'native_linux' AND "cpu" = 'cpu-total'
        resultFormat: time_series
        policy: default
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 90
            type: gt
          operator:
            type: and
    for: 5m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Native host CPU usage high
      description: Native Linux host observation. Check the host, collector and monitoring
        database. Missing data is unknown; this alert does not restart services.
      __dashboardUid__: native-linux-host
      __panelId__: '1'
    labels:
      severity: warning
      host: ben-server
      platform: native_linux
  - uid: native_host_memory_low
    title: Native host memory available low
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource: *id001
        rawQuery: true
        query: SELECT mean("available") FROM "mem" WHERE $timeFilter AND "host" =
          'ben-server' AND "platform" = 'native_linux'
        resultFormat: time_series
        policy: default
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 2000000000
            type: lt
          operator:
            type: and
    for: 2m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Native host memory available low
      description: Native Linux host observation. Check the host, collector and monitoring
        database. Missing data is unknown; this alert does not restart services.
      __dashboardUid__: native-linux-host
      __panelId__: '4'
    labels:
      severity: warning
      host: ben-server
      platform: native_linux
  - uid: native_host_root_disk_high
    title: Native host root filesystem nearly full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource: *id001
        rawQuery: true
        query: SELECT mean("used_percent") FROM "disk" WHERE $timeFilter AND "host"
          = 'ben-server' AND "platform" = 'native_linux' AND "path" = '/'
        resultFormat: time_series
        policy: default
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 90
            type: gt
          operator:
            type: and
    for: 10m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Native host root filesystem nearly full
      description: Native Linux host observation. Check the host, collector and monitoring
        database. Missing data is unknown; this alert does not restart services.
      __dashboardUid__: native-linux-host
      __panelId__: '3'
    labels:
      severity: warning
      host: ben-server
      platform: native_linux
