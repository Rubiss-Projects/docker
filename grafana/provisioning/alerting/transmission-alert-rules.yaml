apiVersion: 1
# Successful but slow RPC calls remain visible on the dashboard, without paging.
deleteRules:
- orgId: 1
  uid: transmission_rpc_slow
groups:
- orgId: 1
  name: transmission
  folder: Docker
  interval: 1m
  rules:
  - uid: transmission_telemetry_missing
    title: Transmission telemetry missing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource: &id001
          type: influxdb
          uid: ddvyigh44dblsd
        rawQuery: true
        query: SELECT count("rpc_up") FROM "transmission" WHERE $timeFilter
        resultFormat: time_series
        policy: default
        alias: ''
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
    for: 2m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Transmission telemetry missing
      description: No recent Transmission samples. Check native Telegraf and InfluxDB. Missing telemetry is not a healthy RPC result. This alert
        does not restart Transmission.
      __dashboardUid__: transmission-stability
      __panelId__: '16'
    labels:
      service: transmission
      severity: warning
  - uid: transmission_inventory_failed
    title: Transmission inventory RPC failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource: *id001
        rawQuery: true
        query: SELECT mean("inventory_up") FROM "transmission" WHERE $timeFilter AND
          "rpc_up" = 1
        resultFormat: time_series
        policy: default
        alias: ''
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 0.1
            type: lt
          operator:
            type: and
    for: 5m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Transmission inventory RPC failing
      description: Session RPC responds, but fewer than 10% of inventory probes
        succeed over five minutes, sustained for five more minutes. Check whether
        the UI and download-client integrations can enumerate torrents. Does not
        restart Transmission or remove torrents.
      __dashboardUid__: transmission-stability
      __panelId__: '4'
    labels:
      service: transmission
      severity: warning
  - uid: transmission_endpoint_failed
    title: Transmission published endpoint failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource:
          type: influxdb
          uid: ddvyigh44dblsd
        rawQuery: true
        query: SELECT min("result_code") FROM "transmission_endpoint" WHERE $timeFilter
        resultFormat: time_series
        policy: default
        alias: ''
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
    for: 5m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Transmission published endpoint failing
      description: Every published-endpoint probe in the five-minute window failed,
        and this condition persisted for five more minutes. No expected HTTP 409
        response was seen; intermittent timeouts with successful probes do not page.
        Check container health and native host connectivity. Does not restart Transmission.
      __dashboardUid__: transmission-stability
      __panelId__: '19'
    labels:
      service: transmission
      severity: warning
  - uid: transmission_host_rpc_missing
    title: Transmission native host RPC telemetry missing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource:
          type: influxdb
          uid: ddvyigh44dblsd
        rawQuery: true
        query: SELECT count("rpc_up") FROM "transmission_host_rpc" WHERE $timeFilter AND "observer" = 'native_linux'
        resultFormat: time_series
        policy: default
        alias: ''
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
    for: 2m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Transmission native host RPC telemetry missing
      description: No native Linux functional RPC samples for the evaluation window. Check
        native Telegraf and InfluxDB. Missing telemetry is unknown, not a healthy service.
        Does not restart Transmission.
      __dashboardUid__: transmission-stability
      __panelId__: '25'
    labels:
      service: transmission
      severity: warning
  - uid: transmission_host_rpc_failed
    title: Transmission native host functional RPC failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: ddvyigh44dblsd
      model:
        datasource:
          type: influxdb
          uid: ddvyigh44dblsd
        rawQuery: true
        query: SELECT mean("rpc_up") FROM "transmission_host_rpc" WHERE $timeFilter AND "observer" = 'native_linux'
        resultFormat: time_series
        policy: default
        alias: ''
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        expression: B
        type: threshold
        conditions:
        - evaluator:
            params:
            - 0.1
            type: lt
          operator:
            type: and
    for: 5m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Transmission native host functional RPC failing
      description: Fewer than 10% of native host functional RPC probes succeed
        within their three-second deadline over five minutes, sustained for five
        more minutes. Check container health, the UI and download-client access.
        Intermittent recoverable stalls do not page. Does not restart Transmission.
      __dashboardUid__: transmission-stability
      __panelId__: '21'
    labels:
      service: transmission
      severity: warning
