apiVersion: 1

groups:
  - orgId: 1
    name: sunday-edge-dfs-workers
    folder: Sunday Edge
    interval: 1m
    rules:
      - uid: sunday_edge_dfs_worker_pool_degraded
        title: Sunday Edge DFS worker pool degraded
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: (sum(up{job="sunday-edge-dfs-workers"}) or vector(0)) / max(sunday_edge_dfs_worker_pool_desired_replicas)
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "1"
          summary: "The DFS pool is below its configured replica count"
          description: "Check docker compose ps/logs in the sunday-edge stack and DFS_REPLICAS in its .env. Intensive Vercel fallback remains disabled."
        labels: { severity: critical, service: sunday-edge-dfs-simulator, maintenance_window: wsl-nightly-availability }

      - uid: sunday_edge_dfs_worker_failures
        title: Sunday Edge DFS worker jobs failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: round(sum(increase(sunday_edge_dfs_worker_jobs_completed_total{status="failed"}[15m])))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "5"
          summary: "DFS compute reported {{ $values.B.Value }} failed jobs in 15 minutes"
          description: "Inspect the Sunday Edge DFS Compute dashboard and journalctl logs before increasing capacity."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }

      - uid: sunday_edge_dfs_worker_poll_errors
        title: Sunday Edge DFS worker polling errors detected
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: round(sum(increase(sunday_edge_dfs_worker_errors_total{stage="poll"}[15m])))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [2], type: gt }
                  operator: { type: and }
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "11"
          summary: "DFS workers exhausted retries for {{ $values.B.Value }} polls in 15 minutes"
          description: "At least 3 polling requests still failed after a bounded retry during the evaluation window. Check the production URL, database connectivity, shared compute secret, network path, and worker journal. Recovered first attempts and job failures are tracked separately."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }

      - uid: sunday_edge_dfs_worker_restarts
        title: Sunday Edge DFS worker restarted unexpectedly
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: sum(resets(sunday_edge_dfs_worker_uptime_seconds[30m]))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "12"
          summary: "{{ $values.B.Value }} DFS worker restarts detected in 30 minutes"
          description: "Confirm whether this was planned maintenance; otherwise inspect systemd status, memory pressure, and the worker journal."
        labels: { severity: warning, service: sunday-edge-dfs-simulator, maintenance_window: wsl-nightly-restart }

      - uid: sunday_edge_dfs_worker_stalled
        title: Sunday Edge DFS worker appears stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 2700, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: 1 - sunday_edge_dfs_worker_idle
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
        # Keep each worker's labeled series pending for the full duration. A
        # range-vector query can only prove that all available samples are busy,
        # not that 45 minutes of samples actually exist after a scrape outage.
        for: 45m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "13"
          summary: "DFS worker {{ $labels.instance }} slot {{ $labels.slot }} has remained busy for at least 45 minutes"
          description: "Inspect the active generation or simulation, its heartbeat/progress, and the corresponding worker journal before restarting anything."
        labels: { severity: critical, service: sunday-edge-dfs-simulator, maintenance_window: wsl-nightly-availability }

      - uid: sunday_edge_dfs_worker_memory_pressure
        title: Sunday Edge DFS worker memory pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: max(sunday_edge_dfs_worker_resident_memory_bytes / (sunday_edge_dfs_worker_memory_limit_bytes > 0))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0.85], type: gt }
                  operator: { type: and }
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "9"
          summary: "A DFS worker is above 85% of its Docker memory limit"
          description: "The threshold follows the actual container memory limit. Review DFS_MEMORY and docker stats in the sunday-edge stack."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }

      - uid: sunday_edge_dfs_cp_recovery_down
        title: Sunday Edge DFS checkpoint recovery unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: sum(up{job="sunday-edge-dfs-checkpoint-recovery"})
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "1"
          summary: "The DFS checkpoint recovery scheduler is not reachable"
          description: "Check the checkpoint-recovery container in the sunday-edge Compose stack. Queue wakeups remain the primary checkpoint path."
        labels: { severity: critical, service: sunday-edge-dfs-simulator, maintenance_window: wsl-nightly-availability }

      - uid: sunday_edge_dfs_cp_recovery_stale
        title: Sunday Edge DFS checkpoint recovery is stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: time() - max(sunday_edge_dfs_checkpoint_recovery_last_success_unixtime_seconds)
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [900], type: gt }
                  operator: { type: and }
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "1"
          summary: "DFS checkpoint recovery has not succeeded for {{ $values.B.Value }} seconds"
          description: "Inspect docker compose logs checkpoint-recovery, the production endpoint, database connectivity, and the shared compute secret."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }
