apiVersion: 1

groups:
  - orgId: 1
    name: sunday-edge-dfs-workers
    folder: Sunday Edge
    interval: 1m
    rules:
      - uid: sunday_edge_dfs_worker_pool_degraded
        title: Sunday Edge DFS worker pool degraded
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: sum(up{job="sunday-edge-dfs-workers"})
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [6], type: lt }
                  operator: { type: and }
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "1"
          summary: "Only {{ $values.B.Value }} of 6 DFS workers are reachable"
          description: "Check the Windows WSL startup task and sunday-edge-dfs-simulator@1..6 systemd units. Vercel fallback remains available."
        labels: { severity: critical, service: sunday-edge-dfs-simulator, maintenance_window: wsl-nightly-availability }

      - uid: sunday_edge_dfs_worker_failures
        title: Sunday Edge DFS worker jobs failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: sum(increase(sunday_edge_dfs_worker_jobs_completed_total{status="failed"}[15m]))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "5"
          summary: "DFS compute reported {{ $values.B.Value }} failed jobs in 15 minutes"
          description: "Inspect the Sunday Edge DFS Compute dashboard and journalctl logs before increasing capacity."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }

      - uid: sunday_edge_dfs_worker_poll_errors
        title: Sunday Edge DFS worker polling errors detected
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: round(sum(increase(sunday_edge_dfs_worker_errors_total{stage="poll"}[15m])))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [2], type: gt }
                  operator: { type: and }
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "11"
          summary: "DFS workers reported {{ $values.B.Value }} application polling errors in 15 minutes"
          description: "At least 3 polling errors persisted during the evaluation window. Check the production URL, shared compute secret, network path, and worker journal. Job failures are alerted separately."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }

      - uid: sunday_edge_dfs_worker_restarts
        title: Sunday Edge DFS worker restarted unexpectedly
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: sum(resets(sunday_edge_dfs_worker_uptime_seconds[30m]))
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "12"
          summary: "{{ $values.B.Value }} DFS worker restarts detected in 30 minutes"
          description: "Confirm whether this was planned maintenance; otherwise inspect systemd status, memory pressure, and the worker journal."
        labels: { severity: warning, service: sunday-edge-dfs-simulator, maintenance_window: wsl-nightly-restart }

      - uid: sunday_edge_dfs_worker_stalled
        title: Sunday Edge DFS worker appears stalled
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 2700, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: 1 - sunday_edge_dfs_worker_idle
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
        # Keep each worker's labeled series pending for the full duration. A
        # range-vector query can only prove that all available samples are busy,
        # not that 45 minutes of samples actually exist after a scrape outage.
        for: 45m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "13"
          summary: "DFS worker {{ $labels.instance }} slot {{ $labels.slot }} has remained busy for at least 45 minutes"
          description: "Inspect the active generation or simulation, its heartbeat/progress, and the corresponding worker journal before restarting anything."
        labels: { severity: critical, service: sunday-edge-dfs-simulator }

      - uid: sunday_edge_dfs_worker_memory_pressure
        title: Sunday Edge DFS worker memory pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: adw07verg2qrkd
            model:
              expr: max(sunday_edge_dfs_worker_resident_memory_bytes)
          - refId: B
            datasourceUid: __expr__
            model: { expression: A, reducer: last, type: reduce }
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator: { params: [440401920], type: gt }
                  operator: { type: and }
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          __dashboardUid__: sunday-edge-dfs-compute
          __panelId__: "9"
          summary: "A DFS worker is using {{ $values.B.Value }} bytes of resident memory"
          description: "The worker has crossed 420 MiB and is approaching its 448 MiB MemoryHigh / 512 MiB MemoryMax systemd limits."
        labels: { severity: warning, service: sunday-edge-dfs-simulator }
