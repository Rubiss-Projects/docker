services:
  tracearr:
    image: ghcr.io/connorgallopo/tracearr:3.1.3@sha256:0a3ca6dba8a7d9f89124207255f5d6580a2b89d9b9c88c408dfe0f288bb6dbf6
    container_name: tracearr
    # Preserve the image entrypoint; validate/apply the Seerr fork compatibility before Node starts.
    command: ["/bin/sh", "-c", "node /opt/tracearr/patch-seerr-books.mjs && exec node apps/server/dist/index.js"]
    ports:
    - 127.0.0.1:3040:3000
    environment:
    - NODE_ENV=production
    - HOST=0.0.0.0
    - TZ=${TZ}
    - DATABASE_URL=postgres://tracearr:${DB_PASSWORD}@tracearr-db:5432/tracearr
    - REDIS_URL=redis://tracearr-redis:6379
    - JWT_SECRET=${JWT_SECRET}
    - COOKIE_SECRET=${COOKIE_SECRET}
    - CORS_ORIGIN=https://tracearr.benlawson.dev
    - TRUST_PROXY=true
    - LOG_LEVEL=info
    depends_on:
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - tracearr_backups:/data/backup
    - ./patch-seerr-books.mjs:/opt/tracearr/patch-seerr-books.mjs:ro
    restart: unless-stopped
    networks:
    - proxynet
    env_file:
    - path: .env
    - path: .env.secret
      required: false
    labels:
    - homepage.group=Observability
    - homepage.name=Tracearr
    - homepage.icon=tracearr.png
    - homepage.href=https://tracearr.benlawson.dev/
    - homepage.siteMonitor=http://tracearr:3000/health
    - homepage.description=Plex playback analytics
    - swag.uptime-kuma.enabled=true
    - swag.uptime-kuma.monitor.url=http://tracearr:3000/health
    - swag.uptime-kuma.monitor.parent=Observability
    - homepage.widget.type=tracearr
    - homepage.widget.url=http://tracearr:3000
    - homepage.widget.key=${TRACEARR_API_KEY}
    - homepage.widget.view=summary
  timescale:
    image: timescale/timescaledb-ha:pg18@sha256:ad8b5095c9e9f19b3c97794133f1dd80f09da9566a5687f79b6208324b98a388
    container_name: tracearr-db
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.license=timescale -c timescaledb.max_tuples_decompressed_per_dml_transaction=100000
      -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off -c max_connections=150
    environment:
    - POSTGRES_USER=tracearr
    - POSTGRES_PASSWORD=${DB_PASSWORD}
    - POSTGRES_DB=tracearr
    - TZ=${TZ}
    volumes:
    - tracearr_postgres:/home/postgres/pgdata/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U tracearr
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - proxynet
  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: tracearr-redis
    command: redis-server --appendonly yes
    volumes:
    - tracearr_redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - proxynet
networks:
  proxynet:
    external: true
    name: proxynet
volumes:
  tracearr_postgres: {}
  # Populate both existing directories before deployment; never start with empty state.
  tracearr_redis_data:
    external: true
    name: tracearr_redis_data
  tracearr_backups:
    external: true
    name: tracearr_backups
