services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
    container_name: open-webui
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_NAME=${WEBUI_NAME}
    env_file:
      - path: .env
      - path: .env.secret
        required: false
    volumes:
      - ./data:/app/backend/data
    ports:
      - 3333:8080
    restart: unless-stopped
    networks:
      - proxynet
    labels:
      - homepage.group=AI & Automation
      - homepage.name=Open WebUI
      - homepage.icon=/icons/openwebui.png
      - homepage.href=https://ai.benlawson.dev/
      - homepage.description=AI Chat Interface
      - swag_ondemand=enable
      - swag_ondemand_urls=https://ai.
      - 'swag_server_custom_directive=include /config/nginx/ondemand.conf;'
      - swag.uptime-kuma.enabled=false
      - swag.uptime-kuma.monitor.parent=AI & Automation
      - swag.uptime-kuma.monitor.url=https://ai.benlawson.dev/

networks:
  proxynet:
    external: true
    name: proxynet
