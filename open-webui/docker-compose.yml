services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_NAME=${WEBUI_NAME}
    env_file:
      - .env
    volumes:
      - ./data:/app/backend/data
    ports:
      - 3333:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxynet
    labels:
      - homepage.group=AI & Automation
      - homepage.name=Open WebUI
      - homepage.icon=/icons/openwebui.png
      - homepage.href=https://ai.benlawson.dev/
      - homepage.description=AI Chat Interface
      - swag_ondemand=enable
      - swag_ondemand_urls=https://ai.
      - 'swag_server_custom_directive=include /config/nginx/ondemand.conf;'

networks:
  proxynet:
    external:
      name: proxynet

