services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      - DOCKER_API_VERSION=${WATCHTOWER_DOCKER_API_VERSION:-1.52}
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_SCHEDULE=0 0 11 * * *  # Run at 6 AM EST (11 AM UTC) - 1 hour after Docker restart at 5 AM
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN}
      - WATCHTOWER_HTTP_API_METRICS=true
      - DOCKER_HOST=tcp://socket-proxy:2375
    ports:
      - 8081:8080
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Watchtower
      - homepage.icon=watchtower.png
      - homepage.href=https://watchtower.benlawson.dev/v1/metrics
      - homepage.description=Service updater
      - homepage.widget.type=watchtower
      - homepage.widget.url=http://watchtower:8080
      - homepage.widget.key=${HOMEPAGE_WIDGET_KEY}
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Infrastructure
      - swag.uptime-kuma.monitor.url=http://watchtower:8080/v1/metrics
      - 'swag.uptime-kuma.monitor.headers={"Authorization": "Bearer ${WATCHTOWER_HTTP_API_TOKEN}"}'
    networks:
      - proxynet
      - socket-proxy-net

networks:
  proxynet:
    name: proxynet
  socket-proxy-net:
    external: true
    name: socket-proxy-net
