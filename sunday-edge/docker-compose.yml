name: sunday-edge

x-worker: &worker
  user: "10001:10001"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
  stop_grace_period: 90s
  networks: [proxynet]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  dfs:
    <<: *worker
    image: ghcr.io/rubiss/sunday-edge-compute:v0.2.0
    # No container_name: Compose must generate a name for each replica.
    scale: ${DFS_REPLICAS:-6}
    env_file:
      - path: compute.env.secret
        required: false
    environment:
      TZ: ${TZ}
      SUNDAY_EDGE_URL: ${SUNDAY_EDGE_URL}
      DFS_WORKER_COUNT: ${DFS_REPLICAS:-6}
      DFS_WORKER_POOL_ID: ${DFS_WORKER_POOL_ID:-ben-server}
      DFS_METRICS_PORT: 9460
      DFS_WORK_SIGNAL_PATH: /data/work-available
      NODE_OPTIONS: --max-old-space-size=384
    cpus: ${DFS_CPUS:-1.0}
    mem_limit: ${DFS_MEMORY:-512m}
    memswap_limit: ${DFS_MEMORY:-512m}
    pids_limit: 128
    # Preserve the legacy research archive in this volume, but expose only the
    # new runtime subdirectory (slot locks and local wakeups) to compute replicas.
    volumes:
      - type: volume
        source: sunday-edge-dfs-data
        target: /data
        volume:
          subpath: runtime
          nocopy: true
    networks:
      proxynet:
        aliases: [sunday-edge-dfs]
    # Prometheus discovers EVERY replica through Docker DNS. The pool's single
    # Homepage widget is attached to the sunday-edge service below.
    labels:
      - swag.uptime-kuma.enabled=false

  checkpoint-recovery:
    <<: *worker
    image: ghcr.io/rubiss/sunday-edge-compute:v0.2.0
    container_name: sunday-edge-checkpoint-recovery
    hostname: ben-server
    entrypoint: [node, --import, tsx]
    command: [workers/dfs-simulator/checkpoint-recovery.mts]
    env_file:
      - path: compute.env.secret
        required: false
    environment:
      TZ: ${TZ}
      SUNDAY_EDGE_URL: ${SUNDAY_EDGE_URL}
      DFS_WORKER_COUNT: ${DFS_REPLICAS:-6}
      DFS_CHECKPOINT_METRICS_PORT: 9460
      WORKER_HEALTH_URL: http://127.0.0.1:9460/metrics
      NODE_OPTIONS: --max-old-space-size=96
    cpus: ${SCHEDULER_CPUS:-0.1}
    mem_limit: ${SCHEDULER_MEMORY:-128m}
    memswap_limit: ${SCHEDULER_MEMORY:-128m}
    pids_limit: 64
    labels:
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://sunday-edge-checkpoint-recovery:9460/metrics
      - swag.uptime-kuma.monitor.parent=Infrastructure

  analytics:
    <<: *worker
    image: ghcr.io/rubiss/sunday-edge-analytics:v0.2.2
    container_name: sunday-edge-analytics
    env_file:
      - path: analytics.env.secret
        required: false
    environment:
      TZ: ${TZ}
      SUNDAY_EDGE_URL: ${SUNDAY_EDGE_URL}
      ANALYTICS_STATE_DIR: /data/state
      CODEX_WORK_DIR: /data/work
      NODE_OPTIONS: --max-old-space-size=1536
    cpus: ${ANALYTICS_CPUS:-2.0}
    mem_limit: ${ANALYTICS_MEMORY:-2g}
    memswap_limit: ${ANALYTICS_MEMORY:-2g}
    pids_limit: 256
    volumes: [sunday-edge-analytics-data:/data]
    stop_grace_period: 26m
    labels:
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://sunday-edge-analytics:9460/healthz
      - swag.uptime-kuma.monitor.parent=Infrastructure

  maintenance:
    <<: *worker
    image: ghcr.io/rubiss/sunday-edge-maintenance:v0.2.0
    container_name: sunday-edge-maintenance
    env_file:
      - path: maintenance.env.secret
        required: false
    environment:
      TZ: ${TZ}
      APP_ORIGIN: ${SUNDAY_EDGE_URL}
      DATABASE_POOL_MAX: 1
      DFS_RESULT_ARCHIVE_DIR: /data/result-archive
      NODE_OPTIONS: --max-old-space-size=1536
    cpus: ${MAINTENANCE_CPUS:-1.0}
    mem_limit: ${MAINTENANCE_MEMORY:-2g}
    memswap_limit: ${MAINTENANCE_MEMORY:-2g}
    pids_limit: 128
    volumes: [sunday-edge-maintenance-data:/data]
    stop_grace_period: 30s
    labels:
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://sunday-edge-maintenance:9460/healthz
      - swag.uptime-kuma.monitor.parent=Infrastructure

  research:
    <<: *worker
    image: ghcr.io/rubiss/sunday-edge-research:v0.2.0
    container_name: sunday-edge-research
    environment:
      TZ: ${TZ}
    cpus: ${RESEARCH_CPUS:-0.5}
    mem_limit: ${RESEARCH_MEMORY:-512m}
    memswap_limit: ${RESEARCH_MEMORY:-512m}
    pids_limit: 64
    volumes: [sunday-edge-research-data:/data]
    stop_grace_period: 31m
    labels:
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://sunday-edge-research:9460/healthz
      - swag.uptime-kuma.monitor.parent=Infrastructure

  sunday-edge:
    <<: *worker
    image: ghcr.io/rubiss/sunday-edge-watchdog:v0.2.0
    container_name: sunday-edge
    env_file:
      - path: watchdog.env.secret
        required: false
    environment:
      TZ: ${TZ}
      SUNDAY_EDGE_URL: ${SUNDAY_EDGE_URL}
      PROMETHEUS_URL: http://prometheus:9090
      DFS_WORKER_COUNT: ${DFS_REPLICAS:-6}
      NODE_OPTIONS: --max-old-space-size=64
    cpus: ${SCHEDULER_CPUS:-0.1}
    mem_limit: ${SCHEDULER_MEMORY:-128m}
    memswap_limit: ${SCHEDULER_MEMORY:-128m}
    pids_limit: 64
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Sunday Edge
      - homepage.icon=/icons/sunday-edge.png
      - homepage.href=https://fantasy.benlawson.dev/
      - homepage.description=Fantasy analytics and compute workers
      - homepage.siteMonitor=http://sunday-edge:9460/healthz
      - homepage.widget.type=customapi
      - homepage.widget.url=http://sunday-edge:9460/status
      - homepage.widget.refreshInterval=15000
      - homepage.widget.mappings[0].field=health
      - homepage.widget.mappings[0].label=Health
      - homepage.widget.mappings[1].field=workers
      - homepage.widget.mappings[1].label=Workers
      - homepage.widget.mappings[2].field=active
      - homepage.widget.mappings[2].label=Active
      - homepage.widget.mappings[3].field=completed
      - homepage.widget.mappings[3].label=Jobs (15m)
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://sunday-edge:9460/healthz
      - swag.uptime-kuma.monitor.parent=Infrastructure

# Existing data must be imported before the first start; Compose cannot silently
# replace a missing external volume with an empty one. No host paths are mounted.
volumes:
  sunday-edge-dfs-data:
    external: true
  sunday-edge-analytics-data:
    external: true
  sunday-edge-maintenance-data:
    external: true
  sunday-edge-research-data:
    external: true

networks:
  proxynet:
    external: true
    name: proxynet
