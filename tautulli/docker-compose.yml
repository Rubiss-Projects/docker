services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.17.1-ls232
    container_name: tautulli
    volumes:
      - ./config:/config
    ports:
      - 8181:8181
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - homepage.group=Observability
      - homepage.name=Tautulli
      - homepage.icon=tautulli.png
      - homepage.href=https://tautulli.benlawson.dev/
      - homepage.siteMonitor=http://tautulli:8181/status
      - homepage.description=Plex metrics
      - homepage.widget.type=tautulli
      - homepage.widget.url=http://tautulli:8181
      - homepage.widget.key=${TAUTULLI_API_KEY}
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.parent=Observability
      - swag.uptime-kuma.monitor.url=https://tautulli.benlawson.dev/status
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet