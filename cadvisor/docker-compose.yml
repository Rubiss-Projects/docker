services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homepage.group=Observability
      - homepage.name=cAdvisor
      - homepage.icon=cadvisor.png
      - homepage.href=https://cadvisor.benlawson.dev/
      - homepage.siteMonitor=http://cadvisor:8080/containers
      - homepage.description=Docker container monitoring
    networks:
      - proxynet

networks:
  proxynet:
    name: proxynet