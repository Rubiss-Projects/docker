# Append with install.ps1 to the existing Windows Telegraf configuration.
# Existing outputs, credentials, alerts and host memory counters stay in place.
[[inputs.win_perf_counters]]
  interval = "10s"
  UseWildcardsExpansion = true
  LocalizeWildcardsExpansion = false
  CountersRefreshInterval = "1m"
  [[inputs.win_perf_counters.object]]
    ObjectName = "Memory"
    Instances = ["------"]
    Counters = ["System Cache Resident Bytes", "Committed Bytes", "Commit Limit", "Pages Input/sec", "Pages Output/sec", "Page Reads/sec", "Page Writes/sec", "Modified Page List Bytes"]
    Measurement = "win_mem"
    WarnOnMissing = true
  [[inputs.win_perf_counters.object]]
    ObjectName = "Process"
    Instances = ["vmmemWSL*"]
    Counters = ["Working Set", "Private Bytes"]
    Measurement = "wsl_process"

[[inputs.exec]]
  commands = ['"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\InfluxData\telegraf\collect-wsl-memory.ps1"']
  interval = "30s"
  timeout = "8s"
  data_format = "influx"
