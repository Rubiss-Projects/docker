# Install only after the local USB driver has passed identity/online checks.
# The existing authenticated InfluxDB output remains unchanged.
[[inputs.upsd]]
  server = "127.0.0.1"
  port = 3493
  interval = "5s"
  force_float = true
  stringify_ids = true
  # Flags belong in fields; changing status tags must not retain old series.
  tagexclude = ["status_*"]

[[processors.starlark]]
  namepass = ["upsd"]
  source = '''
def apply(metric):
    flags = str(metric.fields.get("ups_status", "")).split()
    allowed = ["OL", "OB", "LB", "FSD", "CHRG", "DISCHRG", "RB", "OVER", "BYPASS", "OFF", "TRIM", "BOOST", "ALARM", "CAL"]
    valid = len(flags) > 0 and not ("OL" in flags and "OB" in flags)
    for flag in flags:
        if flag not in allowed:
            valid = False
    metric.fields["telemetry_valid"] = 1.0 if valid else 0.0
    metric.fields["online"] = 1.0 if valid and "OL" in flags else 0.0
    metric.fields["on_battery"] = 1.0 if valid and "OB" in flags else 0.0
    metric.fields["low_battery"] = 1.0 if valid and "LB" in flags else 0.0
    critical = False
    for flag in ["LB", "FSD", "OFF", "OVER", "RB"]:
        if flag in flags:
            critical = True
    metric.fields["critical_status"] = 1.0 if valid and critical else 0.0
    return metric
'''

[[outputs.prometheus_client]]
  listen = "192.168.50.40:9273"
  namepass = ["upsd"]
  ip_range = ["127.0.0.1/32", "192.168.50.40/32", "172.30.0.0/16"]
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
  expiration_interval = "30s"
  export_timestamp = true
  string_as_label = false
