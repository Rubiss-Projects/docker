# Native candidate; the original Windows widgets remain in homepage/config.
- openweathermap:
    label: Weston, FL
    units: imperial
    apiKey: {{HOMEPAGE_VAR_OPENWEATHERMAP_API_KEY}}
    cache: 10

- datetime:
    text_size: sm
    format:
      dateStyle: short
      timeStyle: short
      hour12: true

- resources:
    label: System
    expanded: true
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    units: imperial
    disk:
      - /app/config
      - /media
    diskUnits: bytes
