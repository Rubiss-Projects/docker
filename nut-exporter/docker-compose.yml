services:
  nut-exporter:
    image: ghcr.io/druggeri/nut_exporter:3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
    container_name: nut-exporter
    user: "1000:1000"
    command:
      - --nut.server=${NUT_SERVER}
      - --nut.serverport=${NUT_PORT}
      - --nut.disable_device_info
      - --nut.vars_enable=ups.status,battery.charge,battery.runtime,ups.load,ups.realpower.nominal,input.voltage,battery.voltage
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    expose: ["9199"]
    networks: [proxynet]
    # Informational only, like apcupsd-exporter: no public route, host port,
    # USB device, Docker socket, Kuma recovery, alerts or shutdown credentials.
    # The image healthcheck tests the exporter process, not UPS availability.

networks:
  proxynet:
    external: true
    name: proxynet
