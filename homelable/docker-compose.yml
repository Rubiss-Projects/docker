services:
  homelable:
    image: ghcr.io/pouzor/homelable-frontend:3.7.1@sha256:2e52e1ba1cd0142c03988b247ca38f1fcbcf668efe39fb5849d432298a56a518
    container_name: homelable
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: homelable-backend:8000
    depends_on:
      homelable-backend:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 100
    networks: [proxynet]
    labels:
      - homepage.group=Observability
      - homepage.name=Homelable
      - homepage.icon=mdi-lan
      - homepage.href=https://homelable.benlawson.dev:4443/
      - homepage.description=Office topology and hardware inventory
      - homepage.siteMonitor=http://homelable/api/v1/health
      - swag.uptime-kuma.enabled=true
      - swag.uptime-kuma.monitor.url=http://homelable/api/v1/health
      - swag.uptime-kuma.monitor.parent=Observability
  homelable-backend:
    image: ghcr.io/pouzor/homelable-backend:3.7.1@sha256:f0f5f26461991bb8c14bd835f06244755fed9e63f818fa184b237f2d55f7f188
    container_name: homelable-backend
    restart: unless-stopped
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    env_file:
      - .env
      - .env.secret
    volumes:
      - ./data:/app/data
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/api/v1/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [proxynet]

networks:
  proxynet:
    external: true
    name: proxynet
