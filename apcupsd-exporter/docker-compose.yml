services:
  apcupsd-exporter:
    image: ghcr.io/thespad/apcupsd_exporter:v0.3.0-spad90@sha256:ae392c0110557ae27d72c768718f2a24f0d0a9a78325633be0638ac07180397d
    container_name: apcupsd-exporter
    user: "1000:1000"
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # s6 needs executable runtime files owned by the unprivileged user.
    tmpfs:
      - /run:uid=1000,gid=1000,exec,size=16m
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    expose:
      - "9162"
    networks:
      - proxynet
    # Informational only: the existing APC Homepage card links to Grafana.
    # No Kuma labels, alert rules, or external restart/shutdown automation.

networks:
  proxynet:
    external: true
    name: proxynet
