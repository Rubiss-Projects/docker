version: "3.8"
services:
  minecraft-server:
    image: itzg/minecraft-server:java17
    volumes:
        - D:\Docker\minecraft\data\:/data
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    environment:
      TYPE: PAPER
      EULA: "TRUE"
      OPS: Rubiss_
      ENABLE_WHITELIST: "true"
      MEMORY: 10G
    tty: true
    stdin_open: true
    restart: unless-stopped