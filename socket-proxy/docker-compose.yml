services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:version-3.4.2-r0@sha256:a9de14c1c9697de5384a63c2a8e1fdbb823d74f03c94cde77c59e149169c0326
    container_name: socket-proxy
    environment:
      - CONTAINERS=1 # Allow access to viewing containers (all services)
      - ALLOW_START=1 # Allow starting containers (swag-ondemand, n8n)
      - ALLOW_STOP=1 # Allow stopping containers (swag-ondemand, n8n)
      - ALLOW_RESTARTS=1 # Allow restarting containers (n8n)
      - POST=1 # Allow POST operations (required with START/STOP)
      - INFO=1 # Allow access to system info (homepage)
      - EVENTS=1 # Allow access to events
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - socket-proxy-net

networks:
  socket-proxy-net:
    external: true
    name: socket-proxy-net
