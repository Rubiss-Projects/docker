services:
  lazytainer:
    image: ghcr.io/vmorganp/lazytainer:latest
    container_name: lazytainer
    environment:
      - VERBOSE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxynet
    ports:
      - "3333:8080" # Expose open-webui port (via proxy)
      - "3334:8081" # Expose healthcheck port
      - "11434:11434" # Expose ollama port (via proxy)
    labels:
      # Configuration for ai group
      - "lazytainer.group.ai.ports=8080"
      - "lazytainer.group.ai.inactiveTimeout=300" # 5 minutes
      - "lazytainer.group.ai.pollRate=30" # Check every 30 seconds
      - "lazytainer.group.ai.minPacketThreshold=1" # Start on first packet
      - "lazytainer.group.ai.sleepMethod=stop"
      
      # Configuration for ollama group
      - "lazytainer.group.ollama.ports=11434"
      - "lazytainer.group.ollama.inactiveTimeout=300"
      - "lazytainer.group.ollama.pollRate=30"
      - "lazytainer.group.ollama.minPacketThreshold=1"
      - "lazytainer.group.ollama.sleepMethod=stop"
    restart: unless-stopped

  lazytainer-init:
    build:
      context: .
      dockerfile: init.Dockerfile
    image: lazytainer-init:local
    container_name: lazytainer-init
    network_mode: container:lazytainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    entrypoint: ["/scripts/entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      - lazytainer

networks:
  proxynet:
    name: proxynet
    external: true
