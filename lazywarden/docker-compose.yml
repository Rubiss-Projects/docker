services:
  lazywarden:
    container_name: lazywarden
    hostname: lazywarden
    image: querylab/lazywarden:latest
    env_file:
      - .env
    environment:
      UNLOCK_VAULT: "true"
    volumes:
      - ./config:/root/lazywarden/config
      - ./data:/root/lazywarden/backup-drive/
      - ./.env:/app/.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxynet
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=LazyWarden"
      - "homepage.icon=bitwarden.png"
      - "homepage.href=http://lazywarden:8080"
      - "homepage.description=Bitwarden backup and management tool"
      - "homepage.weight=5"

networks:
  proxynet:
    name: proxynet
