services:
  channels-dvr:
    image: fancybits/channels-dvr:nvidia
    container_name: channels-dvr
    ports:
      - "8089:8089"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    restart: unless-stopped
    volumes:
      - E:\Docker\channels-dvr\config:/channels-dvr
      - E:\Docker\channels-dvr\recordings:/shares/DVR
      - E:\Media\channels-dvr:/shares/DVR/TV
      # Explicitly mount WSL NVIDIA driver paths
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    labels:
      - homepage.group=Media
      - homepage.name=Channels DVR
      - homepage.icon=mdi-television
      - homepage.href=https://channels.benlawson.dev
      - homepage.ping=http://channels-dvr:8089
      - homepage.description=DVR and TV streaming
      - homepage.widget.type=channelsdvrserver
      - homepage.widget.url=http://channels-dvr:8089
    networks:
      - proxynet

networks:
  proxynet:
    external:
        name: proxynet